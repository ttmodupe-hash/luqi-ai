# Legacy Cloud Build configuration is validation-only.
# An external Cloud Build trigger may still invoke this file and incur build
# costs. It cannot push an image, change Cloud Run traffic, or deploy LUQI.
# Railway remains LUQI's source-linked production host.
steps:
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-only'
    args: ['build', '--file', 'Dockerfile', '--tag', 'luqi-validation-only:local', '.']
options:
  logging: CLOUD_LOGGING_ONLY
