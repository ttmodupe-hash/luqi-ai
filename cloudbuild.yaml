steps:
  # Step 1: Build the container image using the Dockerfile context cleanly
  - name: 'gcr.io/cloud-builders/docker'
    args: [
      'build', 
      '-t', 'us-central1-docker.pkg.dev/$PROJECT_ID/luqi-toons-repo/engine-image:latest', 
      '.'
    ]

  # Step 2: Stream the container layer directly up to Google Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: [
      'push', 
      'us-central1-docker.pkg.dev/$PROJECT_ID/luqi-toons-repo/engine-image:latest'
    ]

  # Step 3: Deploy the image live to Cloud Run and explicitly update routing parameters
  - name: 'gcr.io/cloud-builders/gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'luqi-ai-backend'
      - '--image=us-central1-docker.pkg.dev/$PROJECT_ID/luqi-toons-repo/engine-image:latest'
      - '--region=us-central1'
      - '--platform=managed'
      - '--allow-unauthenticated'
      # CRITICAL ROUTING FIXES: Forces Google infrastructure to scale traffic to the latest build instantly
      - '--update-traffic=latest=100'

options:
  logging: CLOUD_LOGGING_ONLY
