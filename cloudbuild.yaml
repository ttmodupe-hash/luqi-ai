# LUQI verification-only Cloud Build configuration.
# The legacy file previously deployed to Cloud Run and sent 100% of traffic
# on any Cloud Build invocation. This is no longer permitted.
# A production deployment requires a separate, manually approved release
# workflow with validated target, immutable image digest, staging evidence,
# rollback instructions and workload identity. No secret substitution here.
steps:
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-only'
    args:
      - 'build'
      - '--pull'
      - '-t'
      - 'luqi-ai-validation:$SHORT_SHA'
      - '.'
options:
  logging: CLOUD_LOGGING_ONLY
timeout: '1800s'
