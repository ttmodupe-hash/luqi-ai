<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- Fixed, offline-capable boot failure notice. No API, storage, analytics or automatic refresh. -->
  <script>
    (() => {
      let failedBoot = false;
      let noticeShown = false;
      const publicBoot = target => {
        if (!target || target.tagName !== 'SCRIPT' || target.type !== 'module') return false;
        try {
          const url = new URL(target.getAttribute('src') || '', location.href);
          return url.origin === location.origin && !url.search && !url.hash &&
            /^\/assets\/index-[A-Za-z0-9_-]+\.js$/.test(url.pathname);
        } catch { return false; }
      };
      const showRecovery = () => {
        if (!failedBoot || noticeShown) return;
        const root = document.getElementById('root');
        // Never overwrite content already rendered by the application.
        if (!root || root.childNodes.length) return;
        noticeShown = true;
        const box = document.createElement('section');
        box.setAttribute('role', 'alert');
        box.setAttribute('aria-labelledby', 'luqi-boot-recovery-title');
        box.style.cssText = 'box-sizing:border-box;max-width:42rem;width:calc(100% - 2rem);margin:1rem auto;padding:1.25rem;border:1px solid #e8b566;border-radius:12px;background:#0f172a;color:#f8fafc;font:16px/1.5 system-ui,sans-serif';
        const title = document.createElement('h1');
        title.id = 'luqi-boot-recovery-title';
        title.textContent = 'Luqi could not start';
        title.style.cssText = 'margin:0 0 0.75rem;font-size:1.35rem;font-weight:700';
        const detail = document.createElement('p');
        detail.textContent = 'A public app file could not load. Copy any unsent text from other open tabs before refreshing. Refreshing may clear unsaved drafts or your current session; it will not send a message, application or payment.';
        detail.style.cssText = 'margin:0 0 1rem';
        const action = document.createElement('button');
        action.type = 'button';
        action.textContent = 'Reload Luqi';
        action.style.cssText = 'min-height:44px;max-width:100%;padding:0.6rem 1rem;border:1px solid #e8b566;border-radius:8px;background:#1e293b;color:#fff;font:inherit;cursor:pointer';
        action.addEventListener('click', () => location.reload());
        box.append(title, detail, action);
        root.appendChild(box);
      };
      window.addEventListener('error', event => {
        if (!publicBoot(event.target)) return;
        failedBoot = true;
        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', showRecovery, { once: true });
        } else {
          showRecovery();
        }
      }, true);
    })();
  </script>

    <meta name="theme-color" content="#111e19" />
    <meta name="description" content="Explore Luqi Chat, practical learning, South African service guidance, opportunities and everyday tools. Check sources and availability; some features require sign-in." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Luqi" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg?v=luqi-q-1" />
    <link rel="apple-touch-icon" href="/icon-192.png?v=luqi-q-1" />
    <title>Luqi — Your everyday workspace</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch(() => {});
        });
      }
    </script>
  </body>
</html>
