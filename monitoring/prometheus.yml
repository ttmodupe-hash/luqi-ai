# =============================================================================
# LUQI AI - Prometheus Configuration
# =============================================================================
# Scrapes metrics from the LUQI AI application and infrastructure components.
# Assumes Prometheus is running in the same cluster.
# =============================================================================

global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

rule_files:
  - /etc/prometheus/alert-rules.yml

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'luqi-ai-app'
    kubernetes_sd_configs:
      - role: pod
        namespaces:
          names:
            - luqi-ai-prod
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
        action: keep
        regex: true
      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_port]
        action: replace
        target_label: __address__
        regex: ([^:]+)(?::\d+)?;(\d+)
        replacement: $1:$2

  - job_name: 'nginx'
    static_configs:
      - targets: ['nginx.luqi-ai-prod.svc.cluster.local:80']

  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres-exporter:9187']

  - job_name: 'redis'
    static_configs:
      - targets: ['redis-exporter:9121']

  - job_name: 'celery'
    static_configs:
      - targets: ['flower:5555']
