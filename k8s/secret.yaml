# =============================================================================
# LUQI AI - Kubernetes Secrets (TEMPLATE)
# =============================================================================
# WARNING: This file contains PLACEHOLDER base64 values.
# You MUST replace them with real secrets before deploying.
# DO NOT commit real secrets to version control.
#
# Recommended: Use kubectl create secret or Sealed Secrets instead.
# See README.md for detailed secret setup instructions.
# =============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: luqi-ai-secrets
  namespace: luqi-ai-prod
  labels:
    app: luqi-ai
    version: v29
    component: secrets
type: Opaque
data:
  # ---------------------------------------------------------------------------
  # DATABASE
  # ---------------------------------------------------------------------------
  # Example: postgresql+asyncpg://luqi:password@postgres:5432/luqi_ai
  DATABASE_URL: "CHANGEME_BASE64"

  # Individual PostgreSQL credentials (used by StatefulSet)
  POSTGRES_USER: "bHVxaQ=="        # luqi
  POSTGRES_PASSWORD: "CHANGEME_BASE64"
  POSTGRES_DB: "bHVxaV9haQ=="      # luqi_ai

  # ---------------------------------------------------------------------------
  # AUTHENTICATION
  # ---------------------------------------------------------------------------
  JWT_SECRET: "CHANGEME_BASE64"
  ADMIN_PASSWORD: "CHANGEME_BASE64"

  # ---------------------------------------------------------------------------
  # REDIS
  # ---------------------------------------------------------------------------
  # Example: redis://:password@redis:6379/0
  REDIS_URL: "CHANGEME_BASE64"
  REDIS_PASSWORD: "CHANGEME_BASE64"

  # ---------------------------------------------------------------------------
  # EXTERNAL APIs
  # ---------------------------------------------------------------------------
  OPENAI_API_KEY: "CHANGEME_BASE64"

  # ---------------------------------------------------------------------------
  # OPTIONAL: Additional secrets can be added here
  # ---------------------------------------------------------------------------
  # STRIPE_API_KEY: "CHANGEME_BASE64"
  # SENDGRID_API_KEY: "CHANGEME_BASE64"
  # SENTRY_DSN: "CHANGEME_BASE64"

# =============================================================================
# NOTE: To generate base64-encoded values:
#   echo -n 'your-secret-value' | base64
#
# Better yet, use kubectl to create the secret without touching this file:
#   kubectl create secret generic luqi-ai-secrets \
#     --namespace=luqi-ai-prod \
#     --from-literal=DATABASE_URL="..." \
#     --from-literal=JWT_SECRET="..." \
#     --dry-run=client -o yaml | kubectl apply -f -
# =============================================================================
