# =============================================================================
# LUQI AI - Celery Worker Deployment
# =============================================================================
# Background task workers that process async jobs (AI model calls,
# data processing, notifications, etc.).
# HPA scales workers from 2 to 10 replicas based on queue length.
# No Service needed — workers consume from Redis, not HTTP.
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: celery-worker
  namespace: luqi-ai-prod
  labels:
    app: luqi-ai
    version: v29
    component: celery-worker
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: luqi-ai
      component: celery-worker
  template:
    metadata:
      labels:
        app: luqi-ai
        version: v29
        component: celery-worker
    spec:
      # Ensure workers start after database and Redis are available
      initContainers:
        - name: wait-for-db
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z postgres 5432; do
                echo "Waiting for PostgreSQL..."
                sleep 2
              done
              echo "PostgreSQL is ready!"

        - name: wait-for-redis
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z redis 6379; do
                echo "Waiting for Redis..."
                sleep 2
              done
              echo "Redis is ready!"

      containers:
        - name: celery-worker
          image: ghcr.io/ttmodupe-hash/luqi-ai:latest
          imagePullPolicy: Always

          # Celery worker command with pool and concurrency settings
          command:
            - celery
            - -A
            - app.celery_app
            - worker
            - --loglevel=INFO
            - --pool=prefork
            - --concurrency=4
            - --prefetch-multiplier=1
            - --max-tasks-per-child=1000

          # Resource limits — workers are CPU-bound during AI processing
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"

          # Environment from ConfigMap
          envFrom:
            - configMapRef:
                name: luqi-ai-config

          # Environment from Secret
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: luqi-ai-secrets
                  key: DATABASE_URL
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: luqi-ai-secrets
                  key: JWT_SECRET
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: luqi-ai-secrets
                  key: REDIS_URL
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: luqi-ai-secrets
                  key: OPENAI_API_KEY

          # Liveness probe — check if Celery worker process is alive
          livenessProbe:
            exec:
              command:
                - celery
                - -A
                - app.celery_app
                - inspect
                - ping
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3

          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1000
            capabilities:
              drop:
                - ALL
