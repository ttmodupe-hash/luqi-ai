# =====================================================================
# AFRILEARN / LUQI AI — NGINX REVERSE PROXY & SECURITY GATEWAY
# =====================================================================

# 1. Traffic Rate Limiting Strategy Configurations
limit_req_zone $binary_remote_addr zone=api_limit_pool:10m rate=30r/s;

server {
    listen 80;
    listen [::]:80;
    server_name api.afrilearn.academy app.afrilearn.academy luqi-ai.com www.luqi-ai.com localhost;

    # Automatic global upgrade path routing to TLS secured endpoints
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.afrilearn.academy app.afrilearn.academy luqi-ai.com www.luqi-ai.com localhost;

    # Production Cryptographic Security Certificates Management Locations
    ssl_certificate /etc/letsencrypt/live/afrilearn.academy/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/afrilearn.academy/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers on;

    # Optimization: Session Cache settings to conserve system resources
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # 2. Network Payload Data Compression Controls (Gzip Core)
    gzip on;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml+rss text/javascript;
    gzip_comp_level 5;

    # 3. Dynamic API Reverse Proxy Interface Router Layer
    location / {
        proxy_pass http://nextjs_app_core:3000;
        proxy_http_version 1.1;
        
        # Connection Header persistence parameters for real-time WebSocket traffic
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;

        # Target Telemetry Tracking Parameter Security Header Passthroughs
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Application Rate Limiting enforcement checks
        limit_req zone=api_limit_pool burst=20 nodelay;
    }
}
