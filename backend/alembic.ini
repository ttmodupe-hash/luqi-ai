# LUQI AI - Alembic Migration Configuration
# A generic, single-database configuration.
#
# Usage:
#   cd backend
#   alembic revision --autogenerate -m "add new table"
#   alembic upgrade head
#
# Environment variables:
#   DATABASE_URL   – Full async DSN (postgresql+asyncpg://...)

[alembic]
# Path to migration scripts
script_location = migrations

# Template used to generate migration file names; The default value is
# %%(rev)s_%%(slug)s; you can customise it below.
# file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s
file_template = %%(rev)s_%%(slug)s

# sys.path path, will be prepended to sys.path if present.
# defaults to the current working directory.
prepend_sys_path = .

# The timezone to use when rendering dates within the migration file
# as well as the filename.  Default is UTC.
# timezone =

# Max length of characters to apply to the "slug" field
truncate_slug_length = 40

# Set to 'true' to run the environment during the 'revision' command,
# regardless of autogenerate.
# revision_environment = false

# Logging configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
