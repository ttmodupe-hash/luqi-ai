[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "claude-engine"
version = "1.0.0"
description = "Provider-agnostic AI engine library with retries, fallback, circuit breakers, memory, tools and structured output."
readme = "SPEC.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "openai>=1.30.0",
    "anthropic>=0.28.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "redis>=5.0",
    "tenacity>=8.0",
    "structlog>=24.0",
]

[project.optional-dependencies]
test = ["pytest>=7.0"]

[tool.setuptools.packages.find]
include = ["claude_engine*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
