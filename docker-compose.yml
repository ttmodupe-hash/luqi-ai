# =============================================================================
# LUQI AI - Production Docker Compose
# =============================================================================
# A production-grade docker-compose configuration for the LUQI AI platform,
# featuring FastAPI backend, React frontend, PostgreSQL, Redis, Celery,
# Nginx reverse proxy, Prometheus monitoring, and Grafana dashboards.
#
# Usage:
#   docker-compose up -d              # Start all services
#   docker-compose logs -f app        # View app logs
#   docker-compose ps                 # Check service status
#   docker-compose down -v            # Stop and remove volumes
# =============================================================================

version: "3.9"

# =============================================================================
# SERVICES
# =============================================================================
services:

  # ---------------------------------------------------------------------------
  # PostgreSQL 15 - Primary Database
  # ---------------------------------------------------------------------------
  # Production-grade PostgreSQL with persistent storage, health checks,
  # and optimized settings for AI workload patterns.
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:15-alpine
    container_name: luqi-postgres
    hostname: postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: luqi_ai
      POSTGRES_USER: luqi
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
      # Performance tuning for AI workloads
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=en_US.UTF-8"
    volumes:
      - postgres_data:/var/lib/postgresql/data/pgdata
      # Custom PostgreSQL configuration for production
      - ./postgres/postgresql.conf:/etc/postgresql/postgresql.conf:ro
    ports:
      - "5432:5432"
    networks:
      - luqi-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U luqi -d luqi_ai || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "2"
        reservations:
          memory: 512M
          cpus: "0.5"
    # Logging configuration for production observability
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        labels: "service"

  # ---------------------------------------------------------------------------
  # Redis 7 - Cache, Message Broker & Celery Backend
  # ---------------------------------------------------------------------------
  # Used for: caching AI responses, session storage, Celery task queue,
  # and real-time feature flags. Alpine image for minimal footprint.
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: luqi-redis
    hostname: redis
    restart: unless-stopped
    command: >
      redis-server
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --appendonly yes
      --appendfsync everysec
      --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
      - ./redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    ports:
      - "6379:6379"
    networks:
      - luqi-network
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1"
        reservations:
          memory: 128M
          cpus: "0.25"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ---------------------------------------------------------------------------
  # FastAPI Backend Application
  # ---------------------------------------------------------------------------
  # Core AI platform backend serving REST API endpoints.
  # Built with multi-stage Dockerfile for optimized production image.
  # ---------------------------------------------------------------------------
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: luqi-app
    hostname: app
    restart: unless-stopped
    environment:
      # Database
      DATABASE_URL: postgresql://luqi:${POSTGRES_PASSWORD}@postgres:5432/luqi_ai
      DATABASE_POOL_SIZE: 20
      DATABASE_MAX_OVERFLOW: 40
      DATABASE_POOL_TIMEOUT: 30
      # Redis
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      REDIS_CACHE_URL: redis://:${REDIS_PASSWORD}@redis:6379/1
      # Security
      JWT_SECRET: ${JWT_SECRET}
      JWT_ALGORITHM: HS256
      JWT_EXPIRATION_HOURS: 24
      # AI Provider API Keys
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_ORG_ID: ${OPENAI_ORG_ID:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # Nemotron (NVIDIA) - Local or hosted
      NEMOTRON_API_KEY: ${NEMOTRON_API_KEY:-}
      NEMOTRON_BASE_URL: ${NEMOTRON_BASE_URL:-http://nemotron:8000/v1}
      NEMOTRON_MODEL: ${NEMOTRON_MODEL:-nvidia/nemotron-3.5-lightning}
      ENABLE_NEMOTRON: ${ENABLE_NEMOTRON:-false}
      # Application
      APP_ENV: production
      APP_DEBUG: "false"
      APP_LOG_LEVEL: INFO
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost,http://localhost:5173}
      # Celery
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD}@redis:6379/2
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD}@redis:6379/3
      # Rate Limiting
      RATE_LIMIT_PER_MINUTE: 60
      # File Uploads
      MAX_UPLOAD_SIZE: 104857600
      UPLOAD_DIR: /app/uploads
      # Monitoring
      METRICS_ENABLED: "true"
      SENTRY_DSN: ${SENTRY_DSN:-}
    volumes:
      - app_uploads:/app/uploads
      - app_logs:/app/logs
    ports:
      - "8080:8080"
    networks:
      - luqi-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/v25/status", "||", "exit", "1"]
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1"
        reservations:
          memory: 256M
          cpus: "0.5"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  # ---------------------------------------------------------------------------
  # Nemotron 3.5 Lightning - Local AI Inference
  # ---------------------------------------------------------------------------
  # Self-hosted NVIDIA Nemotron model for local inference.
  # Optional: only starts when ENABLE_NEMOTRON=true.
  # Requires NVIDIA GPU with CUDA support.
  # ---------------------------------------------------------------------------
  nemotron:
    image: nvcr.io/nvidia/nemotron-3.5-lightning:latest
    container_name: luqi-nemotron
    hostname: nemotron
    restart: unless-stopped
    profiles:
      - nemotron
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - CUDA_VISIBLE_DEVICES=0
      - MODEL_NAME=nvidia/nemotron-3.5-lightning
      - MAX_MODEL_LEN=1000000
      - TENSOR_PARALLEL_SIZE=1
      - GPU_MEMORY_UTILIZATION=0.85
    volumes:
      - nemotron_models:/models
    ports:
      - "8001:8000"
    networks:
      - luqi-network
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s

  # ---------------------------------------------------------------------------
  # Celery Worker - Background Task Processing
  # ---------------------------------------------------------------------------
  # Processes AI-related background tasks: document parsing, embeddings
  # generation, batch inference, and notification dispatch.
  # ---------------------------------------------------------------------------
  celery-worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: luqi-celery-worker
    hostname: celery-worker
    restart: unless-stopped
    command: >
      celery -A backend.celery_app worker
      --loglevel=info
      --concurrency=4
      --prefetch-multiplier=1
      --task-events
      --queues=default,ai-processing,notifications
    environment:
      DATABASE_URL: postgresql://luqi:${POSTGRES_PASSWORD}@postgres:5432/luqi_ai
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD}@redis:6379/2
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD}@redis:6379/3
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      JWT_SECRET: ${JWT_SECRET}
      APP_ENV: production
      PYTHONUNBUFFERED: "1"
    volumes:
      - app_uploads:/app/uploads
      - app_logs:/app/logs/celery
    networks:
      - luqi-network
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      app:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1"
        reservations:
          memory: 128M
          cpus: "0.25"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  # ---------------------------------------------------------------------------
  # Celery Beat - Periodic Task Scheduler
  # ---------------------------------------------------------------------------
  # Schedules recurring tasks: model health checks, data cleanup,
  # usage report generation, and periodic AI model warming.
  # ---------------------------------------------------------------------------
  celery-beat:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: luqi-celery-beat
    hostname: celery-beat
    restart: unless-stopped
    command: >
      celery -A backend.celery_app beat
      --loglevel=info
      --scheduler django_celery_beat.schedulers:DatabaseScheduler
      --max-interval=300
    environment:
      DATABASE_URL: postgresql://luqi:${POSTGRES_PASSWORD}@postgres:5432/luqi_ai
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD}@redis:6379/2
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD}@redis:6379/3
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      JWT_SECRET: ${JWT_SECRET}
      APP_ENV: production
      PYTHONUNBUFFERED: "1"
    volumes:
      - app_logs:/app/logs/celery
      - celery_beat_data:/app/celerybeat
    networks:
      - luqi-network
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"
        reservations:
          memory: 64M
          cpus: "0.1"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ---------------------------------------------------------------------------
  # Nginx - Reverse Proxy & Load Balancer
  # ---------------------------------------------------------------------------
  # Production-grade reverse proxy handling SSL termination, rate limiting,
  # gzip compression, static file serving, and security headers.
  # ---------------------------------------------------------------------------
  nginx:
    image: nginx:alpine
    container_name: luqi-nginx
    hostname: nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - nginx_cache:/var/cache/nginx
    networks:
      - luqi-network
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health", "||", "exit", "1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"
        reservations:
          memory: 64M
          cpus: "0.1"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ---------------------------------------------------------------------------
  # Prometheus - Metrics Collection
  # ---------------------------------------------------------------------------
  # Scrapes metrics from all services for monitoring and alerting.
  # ---------------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:latest
    container_name: luqi-prometheus
    hostname: prometheus
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
      - "--web.enable-lifecycle"
      - "--storage.tsdb.min-block-duration=2h"
      - "--storage.tsdb.max-block-duration=2h"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - luqi-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9090/-/healthy", "||", "exit", "1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1"
        reservations:
          memory: 256M
          cpus: "0.25"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ---------------------------------------------------------------------------
  # Grafana - Visualization Dashboards
  # ---------------------------------------------------------------------------
  # Provides rich dashboards for monitoring application metrics,
  # infrastructure health, and AI model performance.
  # ---------------------------------------------------------------------------
  grafana:
    image: grafana/grafana:latest
    container_name: luqi-grafana
    hostname: grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-http://localhost:3000}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SECURITY_DISABLE_GRAVATAR: "true"
      GF_SECURITY_ANGULAR_SUPPORT_ENABLED: "false"
      # Performance
      GF_DATABASE_TYPE: postgres
      GF_DATABASE_HOST: postgres:5432
      GF_DATABASE_NAME: luqi_ai
      GF_DATABASE_USER: luqi
      GF_DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
      GF_DATABASE_SSL_MODE: disable
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources:ro
    ports:
      - "3000:3000"
    networks:
      - luqi-network
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"
        reservations:
          memory: 128M
          cpus: "0.1"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

# =============================================================================
# NETWORKS
# =============================================================================
networks:
  luqi-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
    labels:
      - "com.luqi.network=production"

# =============================================================================
# VOLUMES
# =============================================================================
volumes:
  postgres_data:
    driver: local
    labels:
      - "com.luqi.volume=postgres"
  redis_data:
    driver: local
    labels:
      - "com.luqi.volume=redis"
  app_uploads:
    driver: local
    labels:
      - "com.luqi.volume=uploads"
  app_logs:
    driver: local
    labels:
      - "com.luqi.volume=logs"
  celery_beat_data:
    driver: local
    labels:
      - "com.luqi.volume=celery-beat"
  nginx_cache:
    driver: local
    labels:
      - "com.luqi.volume=nginx-cache"
  prometheus_data:
    driver: local
    labels:
      - "com.luqi.volume=prometheus"
  grafana_data:
    driver: local
    labels:
      - "com.luqi.volume=grafana"
  nemotron_models:
    driver: local
    labels:
      - "com.luqi.volume=nemotron-models"

# =============================================================================
# NOTES
# =============================================================================
# - Copy .env.example to .env and fill in your secrets before running
# - Run database migrations before first start:
#     docker-compose run --rm app alembic upgrade head
# - Create initial admin user:
#     docker-compose run --rm app python -m backend.create_admin
# - View logs: docker-compose logs -f [service_name]
# - Scale workers: docker-compose up -d --scale celery-worker=3
# - Start with Nemotron: docker-compose --profile nemotron up -d
# =============================================================================
