version: "3.8"

services:
  luqi:
    build: .
    container_name: luqi-ai
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - LUQI_ENV=production
      - LUQI_LOG_LEVEL=INFO
      - LUQI_CORS_ORIGINS=*
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
