version: '3.8'

services:
  omega-ai:
    build: .
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///omega_ai.db
      - REDIS_URL=redis://redis:6379/0
      - LOG_LEVEL=INFO
    volumes:
      - ./data:/app/data
      - ./models:/app/models
    depends_on:
      - redis

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  web-ui:
    build:
      context: ./web_ui
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - API_URL=http://omega-ai:8000
    depends_on:
      - omega-ai

volumes:
  redis_data:
