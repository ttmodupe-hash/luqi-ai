name: LUQI Legacy Gemini Boundary

on:
  pull_request:
    branches: [main]
    paths:
      - 'api/geminiService.ts'
      - 'scripts/verify-legacy-gemini-boundary.mjs'
      - '.github/workflows/legacy-gemini-boundary.yml'
      - 'package.json'
      - 'package-lock.json'
  push:
    branches: [main]
    paths:
      - 'api/geminiService.ts'
      - 'scripts/verify-legacy-gemini-boundary.mjs'
      - '.github/workflows/legacy-gemini-boundary.yml'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-retired-adapter:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # Run before dependency installation: no SDK, server, database or provider.
      - name: Verify rejection without provider dependencies
        run: node --experimental-strip-types --test scripts/verify-legacy-gemini-boundary.mjs
      - name: Install locked compiler without package lifecycle scripts
        run: npm ci --legacy-peer-deps --include=dev --ignore-scripts
      - name: Strictly check the retired adapter's compatibility types
        run: npx --no-install tsc --noEmit --strict --skipLibCheck --target es2022 --module esnext --moduleResolution bundler api/geminiService.ts
