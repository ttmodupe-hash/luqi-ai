name: LUQI Local Storyboard Drafts
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: studio-drafts-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify-studio-drafts:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Check bounded local-file contracts without credentials
        run: node --experimental-strip-types --test tests/studio-draft.test.mjs
      - name: Install locked application and test dependencies without lifecycle scripts
        run: npm ci --legacy-peer-deps --include=dev --ignore-scripts
      - name: Verify the actual legacy exporter and local import UI with synthetic files
        run: npx --no-install vitest run tests/content-studio.test.ts tests/studio-draft-page.test.tsx
      - name: Strictly check both studio source trees
        run: npx --no-install tsc --noEmit --strict --skipLibCheck --jsx react-jsx --target es2022 --module esnext --moduleResolution bundler --esModuleInterop src/pages/ContentStudioPage.tsx app/src/pages/ContentStudioPage.tsx
