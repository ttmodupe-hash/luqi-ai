name: LUQI Production Frontend Parity
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - 'vite.config.ts'
      - 'Dockerfile'
      - 'package*.json'
      - 'src/**'
      - 'app/src/**'
      - 'scripts/verify-production-frontend.mjs'
      - 'playwright.container.config.ts'
      - 'browser-tests/provider-free-startup.spec.ts'
      - 'browser-tests/workspace-tool-search.spec.ts'
      - '.github/workflows/production-frontend-parity.yml'
permissions:
  contents: read
concurrency:
  group: frontend-parity-${{ github.ref }}
  cancel-in-progress: true
jobs:
  exact-container-frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: npm ci --legacy-peer-deps --include=dev
      - name: Build and inspect normal checkout
        run: npm run build && node scripts/verify-production-frontend.mjs
      - name: Build exact Railway image and its mandatory frontend gate
        run: docker build --progress=plain -t luqi-frontend-parity:ci .
      - name: Compare checkout and container JavaScript and CSS hashes
        run: |
          container=$(docker create luqi-frontend-parity:ci)
          trap 'docker rm "$container" >/dev/null' EXIT
          docker cp "$container":/srv/luqi/.luqi-frontend-manifest.json /tmp/luqi-container-frontend.json
          cmp .luqi-frontend-manifest.json /tmp/luqi-container-frontend.json
          docker run --rm --network none --entrypoint /bin/sh luqi-frontend-parity:ci -c \
            'test "$(id -u)" -ne 0 && test "$(pwd -P)" = /srv/luqi && test "$(readlink /app)" = /srv/luqi && test -s /app/dist/reset-account-password.js && test -s /app/dist/prepare-mysql-schema.js'
          echo 'PASS byte-identical JS/CSS, non-root runtime and legacy operator path compatibility'
      - name: Prove the old colliding layout is rejected rather than normalized silently
        run: |
          python3 - <<'PY'
          from pathlib import Path
          text = Path('Dockerfile').read_text()
          assert 'WORKDIR /srv/luqi' in text and 'RUN ln -s /srv/luqi /app' in text
          text = text.replace('WORKDIR /srv/luqi', 'WORKDIR /app').replace('RUN ln -s /srv/luqi /app\n', '').replace('/srv/luqi/node_modules', '/app/node_modules')
          Path('/tmp/Dockerfile.luqi-collision').write_text(text)
          PY
          if docker build --progress=plain -f /tmp/Dockerfile.luqi-collision -t luqi-frontend-collision:ci . > /tmp/luqi-collision.log 2>&1; then
            echo 'ERROR: known colliding layout was not blocked'; exit 1
          fi
          grep -F '"app/index.html"' /tmp/luqi-collision.log
          grep -F 'LUQI_FRONTEND_TREE_DRIFT' /tmp/luqi-collision.log
          echo 'PASS historical nested-entry regression is caught by the same production gate'
      - name: Install locked browser engines
        run: npx --no-install playwright install --with-deps chromium webkit
      - name: Exercise actual container frontend with synthetic API responses
        run: |
          docker run --detach --name luqi-frontend-parity --publish 127.0.0.1:4173:3000 \
            --env NODE_ENV=production --env PORT=3000 \
            --env JWT_SECRET=ci-only-not-a-real-key-1234567890123456789012 \
            luqi-frontend-parity:ci
          trap 'docker rm -f luqi-frontend-parity >/dev/null 2>&1 || true' EXIT
          ready=0
          for attempt in $(seq 1 30); do
            if curl --fail --silent --max-time 2 http://127.0.0.1:4173/v1/health >/dev/null; then ready=1; break; fi
            sleep 1
          done
          test "$ready" -eq 1
          npx --no-install playwright test --config=playwright.container.config.ts
      - name: Record bounded scope
        run: echo 'Exact Dockerfile and deployed-style static hosting tested; synthetic API fixtures only. No production credentials, account writes, AI requests or payment activation. Physical-device and full launch gates remain separate.' >> "$GITHUB_STEP_SUMMARY"
