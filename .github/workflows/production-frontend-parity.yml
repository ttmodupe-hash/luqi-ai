name: LUQI Production Frontend Parity
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - 'vite.config.ts'
      - 'Dockerfile'
      - 'package*.json'
      - 'src/**'
      - 'app/src/**'
      - 'scripts/verify-production-frontend.mjs'
      - '.github/workflows/production-frontend-parity.yml'
permissions:
  contents: read
concurrency:
  group: frontend-parity-${{ github.ref }}
  cancel-in-progress: true
jobs:
  exact-container-frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: npm ci --legacy-peer-deps --include=dev
      - name: Build and inspect normal checkout
        run: npm run build && node scripts/verify-production-frontend.mjs
      - name: Build exact Railway image at its actual working directory
        run: docker build --progress=plain -t luqi-frontend-parity:ci .
      - name: Verify container frontend graph and actual emitted code
        run: docker run --rm --network none --entrypoint node luqi-frontend-parity:ci scripts/verify-production-frontend.mjs
      - name: Install locked browser engines
        run: npx --no-install playwright install --with-deps chromium webkit
      - name: Exercise actual container frontend with synthetic API responses
        env:
          LUQI_BROWSER_BASE_URL: http://127.0.0.1:4173
        run: |
          docker run --detach --name luqi-frontend-parity --publish 127.0.0.1:4173:3000 \
            --env NODE_ENV=production --env PORT=3000 \
            --env JWT_SECRET=ci-only-not-a-real-key-1234567890123456789012 \
            luqi-frontend-parity:ci
          trap 'docker rm -f luqi-frontend-parity >/dev/null 2>&1 || true' EXIT
          ready=0
          for attempt in $(seq 1 30); do
            if curl --fail --silent --max-time 2 http://127.0.0.1:4173/v1/health >/dev/null; then ready=1; break; fi
            sleep 1
          done
          test "$ready" -eq 1
          npx --no-install playwright test browser-tests/provider-free-startup.spec.ts browser-tests/workspace-tool-search.spec.ts
          npx --no-install playwright test --config=playwright.webkit.config.ts browser-tests/provider-free-startup.spec.ts browser-tests/workspace-tool-search.spec.ts
      - name: Record bounded scope
        run: echo 'Exact Dockerfile and deployed-style static hosting tested; synthetic API fixtures only. No production credentials, account writes, AI requests or payment activation. Physical-device and full launch gates remain separate.' >> "$GITHUB_STEP_SUMMARY"
