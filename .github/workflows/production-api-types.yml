name: LUQI Production API Types

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-production-api:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install locked compiler and application types
        run: npm ci --legacy-peer-deps --include=dev --ignore-scripts
      - name: Strictly check every import reachable from the production API
        shell: bash
        run: |
          set -o pipefail
          npx --no-install tsc --noEmit --strict --skipLibCheck --target es2022 --module esnext --moduleResolution bundler --esModuleInterop api/boot.ts 2>&1 | tee /tmp/luqi-api-types.txt
      - name: Verify repaired API contracts without provider calls or a production database
        run: npx --no-install vitest run tests/query-results.test.ts tests/agent-tool-calls.test.ts tests/legacy-stream-boundary.test.ts tests/legacy-stream-default.test.ts tests/search-option-contract.test.ts tests/session-history-types.test.ts tests/trpc-authorization.test.ts tests/ai-pilot-route.test.ts tests/legacy-ai-budget-guard.test.ts
      - name: Type-check the new regression fixtures
        run: npx --no-install tsc --noEmit --strict --skipLibCheck --target es2022 --module esnext --moduleResolution bundler --esModuleInterop tests/query-results.test.ts tests/agent-tool-calls.test.ts tests/legacy-stream-boundary.test.ts tests/legacy-stream-default.test.ts tests/search-option-contract.test.ts tests/session-history-types.test.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: production-api-typecheck
          path: /tmp/luqi-api-types.txt
          if-no-files-found: ignore
          retention-days: 7
