name: LUQI Real MySQL Security Integration
on:
  pull_request:
    branches: [main, "fix/**"]
    paths:
      - "api/services/**"
      - "api/video.ts"
      - "api/rest-compat.ts"
      - "db/**"
      - ".github/workflows/mysql-video-integration.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mysql-ledger-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci-only-password
          MYSQL_DATABASE: luqi_integration
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pci-only-password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=15
    env:
      DATABASE_URL: mysql://root:ci-only-password@127.0.0.1:3306/luqi_integration
      RUN_MYSQL_INTEGRATION: "1"
      NODE_ENV: test
      LUQI_VIDEO_DAILY_JOB_LIMIT: "3"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Exercise genuine InnoDB transactions and owner-scoped video ledger
        run: npx vitest run api/services/paidVideo.mysql.integration.test.ts
