name: LUQI Web Build

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install exactly as Railway web image
        run: npm ci --legacy-peer-deps --include=dev
      - name: Verify persistent database configuration contracts
        run: npx vitest run tests/mysql-config.test.ts tests/ai-provider-contract.test.ts tests/ai-pilot-budget.test.ts tests/ai-pilot-auth.test.ts tests/legacy-ai-budget-guard.test.ts tests/http-guard.test.ts tests/gemini-pilot-compat.test.ts tests/production-mysql-bootstrap.test.ts tests/self-healing-truth.test.ts tests/legacy-payments-closed.test.ts tests/billing-dashboard-truth.test.ts tests/workspace-truth.test.ts
      - name: Run integrity gate
        run: node scripts/verify-build.mjs
      - name: Build public UI and API bundle
        run: npm run build
      - name: Verify deployment entrypoints
        run: test -s dist/boot.js && test -s dist/public/index.html
      - name: Smoke-test production HTTP health endpoint
        env:
          NODE_ENV: production
          PORT: "8765"
          JWT_SECRET: "ci-health-check-only-ephemeral-secret-123456"
        run: |
          node dist/boot.js > /tmp/luqi-health.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent --show-error http://127.0.0.1:8765/v1/health > /tmp/luqi-health.json; then
              cat /tmp/luqi-health.json
              grep -q '"status":"healthy"' /tmp/luqi-health.json
              exit 0
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              cat /tmp/luqi-health.log
              exit 1
            fi
            sleep 1
          done
          cat /tmp/luqi-health.log
          exit 1
      - name: Verify shared frontend helpers in both source trees
        run: |
          node --input-type=module -e '
            import fs from "node:fs";
            for (const name of ["api.ts", "utils.ts", "languages.ts"]) {
              const a = fs.readFileSync("src/lib/" + name, "utf8");
              const b = fs.readFileSync("app/src/lib/" + name, "utf8");
              if (a !== b) {
                throw new Error("Frontend shared helper diverged: " + name);
              }
            }
            console.log("Both frontend source trees have the same API, styling and language helpers.");
          '
