name: LUQI Web Build

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      # Install from lockfiles without the optional, egress-limited npm cache.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install exactly as Railway web image
        run: npm ci --legacy-peer-deps --include=dev
      - name: Verify persistent database configuration contracts
        run: npx vitest run tests/cloudflare-worker.test.ts tests/auth-throttle-routes.test.ts tests/account-entry-redirect.test.ts tests/legacy-controls.test.ts tests/trpc-authorization.test.ts tests/archive-page.test.tsx tests/mysql-config.test.ts tests/runtime-schema.test.ts tests/runtime-role-config.test.ts tests/ai-provider-contract.test.ts tests/ai-pilot-budget.test.ts tests/ai-pilot-auth.test.ts tests/user-token.test.ts tests/auth-input.test.ts tests/legacy-ai-budget-guard.test.ts tests/http-guard.test.ts tests/http-safety.test.ts tests/ai-pilot-route.test.ts tests/gemini-pilot-compat.test.ts tests/production-mysql-bootstrap.test.ts tests/self-healing-truth.test.ts tests/legacy-payments-closed.test.ts tests/support-ticketing-unavailable.test.ts tests/support-page-truth.test.tsx tests/billing-dashboard-truth.test.ts tests/workspace-truth.test.ts tests/pilot-credential-check.test.ts tests/account-recovery.test.ts tests/password-change.test.ts tests/password-change-client.test.ts tests/private-conversations.test.ts tests/companion-client.test.ts tests/account-access.test.tsx tests/customer-entry-page.test.tsx tests/customer-session.test.tsx tests/customer-session-boundaries.test.tsx tests/pilot-info.test.tsx tests/content-studio.test.ts tests/multimodal-page.test.tsx tests/companion-page.test.tsx tests/dependency-audit.test.ts tests/desktop-boundary.test.ts tests/legacy-admin.test.ts tests/admin-status-ui.test.tsx tests/legacy-operations.test.ts tests/service-worker-status.test.ts tests/release-identity.test.ts tests/release-observation.test.ts tests/omega-tasks.test.ts tests/omega-dashboard-client.test.ts tests/omega-dashboard-page.test.tsx tests/omega-local-calculators.test.tsx tests/omega-integration.test.tsx tests/business-desk.test.ts tests/business-desk-page.test.tsx tests/study-desk.test.ts tests/study-desk-page.test.tsx tests/encrypted-quote-backup.test.tsx tests/business-pipeline.test.ts tests/business-pipeline-page.test.tsx tests/project-vault-contract.test.ts tests/project-vault-api.test.ts tests/project-vault-crypto.test.ts tests/runtime-liveness.test.ts tests/rights-source-guide.test.ts tests/rights-guide-page.test.tsx
      - name: Verify bounded merchant-hosted checkout without money movement
        run: npx vitest run tests/hosted-checkout.test.ts tests/payments-page.test.tsx
      - name: Verify bounded paid-provider transport without external calls
        run: npx vitest run tests/ai-pilot-transport.test.ts tests/ai-pilot-client.test.ts tests/ai-pilot-page.test.tsx tests/pilot-conversation.test.ts tests/luqi-guide-page.test.tsx tests/luqi-intent-guide.test.ts
      - name: Verify local consumer-rights explanations and no-model story handling
        run: npx vitest run tests/consumer-rights-guide.test.ts tests/consumer-rights-page.test.tsx
      - name: Type-check consumer-rights source registry and safe story interface
        run: npx tsc --noEmit --strict --skipLibCheck --jsx react-jsx --target es2022 --module esnext --moduleResolution bundler --esModuleInterop src/lib/consumer-rights-guide.ts src/components/ConsumerRightsAssistant.tsx
      - name: Verify offline AI cost review does not certify bills
        run: node --test tests/provider-cost-review.test.mjs
      - name: Verify retired static authentication entrypoints
        run: node --test tests/retired-public-auth.test.mjs
      - name: Verify retired public identity and security consoles
        run: node --test tests/retired-legacy-public-pages.test.mjs
      - name: Verify public and private administration separation
        run: node --test tests/public-admin-nav-truth.test.mjs
      - name: Type-check paid pilot gateway
        run: npx tsc --noEmit --strict --skipLibCheck --target es2022 --module esnext --moduleResolution bundler --esModuleInterop api/services/aiPilotGateway.ts api/services/pilotCredentialCheck.ts api/ai-pilot.ts api/lib/httpSafety.ts api/lib/releaseIdentity.ts
      - name: Type-check local content studio
        run: npx tsc --noEmit --strict --skipLibCheck --jsx react-jsx --target es2022 --module esnext --moduleResolution bundler --esModuleInterop src/pages/ContentStudioPage.tsx src/lib/content-studio.ts src/pages/MultimodalHubPage.tsx
      - name: Type-check private encrypted project vault
        run: npx tsc --noEmit --strict --skipLibCheck --jsx react-jsx --target es2022 --module esnext --moduleResolution bundler --esModuleInterop api/private-project-vault.ts api/services/projectVaultStore.ts api/services/projectVaultContract.ts src/lib/project-vault-crypto.ts
      - name: Type-check local Study Desk without external services
        run: npx tsc --noEmit --strict --skipLibCheck --jsx react-jsx --target es2022 --module esnext --moduleResolution bundler --esModuleInterop src/pages/StudyDeskPage.tsx src/lib/study-desk.ts
      - name: Type-check public source-linked rights guide
        run: npx tsc --noEmit --strict --skipLibCheck --jsx react-jsx --target es2022 --module esnext --moduleResolution bundler --esModuleInterop src/pages/RightsGuidePage.tsx src/lib/rights-source-guide.ts
      - name: Type-check Omega dashboard and client
        run: npx tsc --noEmit --strict --skipLibCheck --jsx react-jsx --target es2022 --module esnext --moduleResolution bundler --esModuleInterop src/pages/OmegaTasksPage.tsx src/lib/omega-tasks.ts
      - name: Type-check tRPC account boundary
        run: npx tsc --noEmit --strict --skipLibCheck --target es2022 --module esnext --moduleResolution bundler --esModuleInterop api/context.ts api/middleware.ts api/offline.ts api/trpc-http.ts
      - name: Type-check private conversation export
        run: npx tsc --noEmit --strict --skipLibCheck --jsx react-jsx --target es2022 --module esnext --moduleResolution bundler --esModuleInterop api/services/authThrottle.ts api/account-security.ts api/private-conversations.ts src/lib/private-conversations.ts src/pages/CompanionPage.tsx src/components/AccountAccessForm.tsx src/pages/CustomerEntryPage.tsx src/pages/StartPage.tsx src/pages/AiPilotPage.tsx src/lib/ai-pilot.ts
      - name: Type-check database operator and runtime preflight
        run: npx tsc --noEmit --strict --skipLibCheck --target es2022 --module esnext --moduleResolution bundler --esModuleInterop db/runtimeSchema.ts db/runtimeRole.ts db/bootstrap.ts scripts/prepare-mysql-schema.ts scripts/prepare-mysql-runtime-role.ts
      - name: Run integrity gate
        run: node scripts/verify-build.mjs
      - name: Build public UI and API bundle
        run: npm run build
      - name: Prepare Chromium for browser checks
        timeout-minutes: 4
        shell: bash
        run: |
          # GitHub's Ubuntu runner supplies Chrome with its system libraries.
          # Prefer that executable to an unbounded apt mirror/download wait.
          luqi_browser_path="$(command -v google-chrome || command -v chromium || true)"
          if [ -n "$luqi_browser_path" ]; then
            "$luqi_browser_path" --version
            echo "LUQI_CHROMIUM_PATH=$luqi_browser_path" >> "$GITHUB_ENV"
          else
            npx playwright install --with-deps chromium --only-shell
          fi
      - name: Verify desktop and mobile browser flows with synthetic API fixtures
        run: npx playwright test
      - name: Preserve public pilot layout evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-pilot-layouts
          path: |
            test-results/**/getting-started.png
            test-results/**/plans-availability.png
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failure-evidence
          path: test-results/
      - name: Verify deployment entrypoints
        run: test -s dist/boot.js && test -s dist/public/index.html && test -s dist/reset-account-password.js && test -s dist/prepare-mysql-schema.js && test -s dist/prepare-mysql-runtime-role.js
      - name: Verify recovery terminal safety
        run: python scripts/ci-recovery-cli.py
      - name: Smoke-test production HTTP health endpoint
        env:
          NODE_ENV: production
          PORT: "8765"
          JWT_SECRET: "ci-health-check-only-ephemeral-secret-123456"
          RAILWAY_GIT_COMMIT_SHA: ""
        run: |
          node dist/boot.js > /tmp/luqi-health.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent --show-error http://127.0.0.1:8765/v1/health > /tmp/luqi-health.json; then
              cat /tmp/luqi-health.json
              grep -q '"status":"healthy"' /tmp/luqi-health.json
              node --input-type=module -e '
                const release = await fetch("http://127.0.0.1:8765/v1/release");
                if (release.status !== 503 || release.headers.get("cache-control") !== "no-store" ||
                    (await release.json()).code !== "RELEASE_IDENTITY_UNAVAILABLE") throw new Error("Missing release metadata must fail closed");
                for (const [path, code] of [["/api/v1/admin/verify", "ADMIN_SESSION_UNAVAILABLE"], ["/api/v1/system-api-matrix", "PROVIDER_TELEMETRY_UNAVAILABLE"], ["/api/v1/audit/seal", "LEGACY_OPERATION_UNAVAILABLE"], ["/api/v1/audit/ledger", "LEGACY_OPERATION_UNAVAILABLE"], ["/api/v1/offline-sync/bundle", "LEGACY_OPERATION_UNAVAILABLE"], ["/api/v1/grading/ledger/other-account", "LEGACY_OPERATION_UNAVAILABLE"], ["/security/diagnostics", "LEGACY_OPERATION_UNAVAILABLE"], ["/api/science/curated-targets", "LEGACY_OPERATION_UNAVAILABLE"], ["/api/science/bio-query", "LEGACY_OPERATION_UNAVAILABLE"]]) {
                  const response = await fetch("http://127.0.0.1:8765" + path);
                  const body = await response.json();
                  if (response.status !== 503 || response.headers.get("cache-control") !== "no-store" || body.code !== code) throw new Error("Legacy admin boundary failed: " + path);
                  console.log(path + " rejects unavailable admin/telemetry access");
                }
                for (const path of ["/api/v1/omega/tasks", "/api/v1/omega/tasks/status"]) {
                  const response = await fetch("http://127.0.0.1:8765" + path);
                  if (response.status !== 401 || response.headers.get("cache-control") !== "no-store" ||
                      (await response.json()).code !== "AUTH_REQUIRED") throw new Error("Omega auth boundary failed");
                  console.log(path + " requires authenticated account access");
                }
              '
              node scripts/verify-trpc-boundary.mjs
              node scripts/verify-legacy-controls.mjs
              exit 0
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              cat /tmp/luqi-health.log
              exit 1
            fi
            sleep 1
          done
          cat /tmp/luqi-health.log
          exit 1
      - name: Verify shared frontend helpers in both source trees
        run: |
          node --input-type=module -e '
            import fs from "node:fs";
            for (const name of ["api.ts", "utils.ts", "languages.ts"]) {
              const a = fs.readFileSync("src/lib/" + name, "utf8");
              const b = fs.readFileSync("app/src/lib/" + name, "utf8");
              if (a !== b) {
                throw new Error("Frontend shared helper diverged: " + name);
              }
            }
            for (const name of ["components/WorkspaceLayout.tsx", "components/HeroAiChatConsole.tsx", "components/workspace-catalog.ts", "pages/Home.tsx", "pages/ServiceStatusPage.tsx", "pages/PendulumLabPage.tsx", "workspace.css", "omega-tasks.css", "pages/OmegaTasksPage.tsx", "lib/omega-tasks.ts", "components/OmegaSubmissionForm.tsx", "pages/ArchiveVaultPage.tsx", "components/AccountAccessForm.tsx", "components/AccountPasswordForm.tsx", "components/ConsumerRightsAssistant.tsx", "lib/consumer-rights-guide.ts", "lib/account-security.ts", "pages/StartPage.tsx", "pages/RightsGuidePage.tsx", "lib/rights-source-guide.ts", "pages/AiPilotPage.tsx", "pages/ContentStudioPage.tsx", "pages/MultimodalHubPage.tsx", "pages/VideoStudioPage.tsx", "lib/content-studio.ts", "content-studio.css", "lib/ai-pilot.ts", "pages/CompanionPage.tsx", "lib/private-conversations.ts", "pages/PricingPage.tsx", "pages/PrivacyPage.tsx", "pages/TermsPage.tsx", "pages/ContactPage.tsx"]) {
              if (fs.readFileSync("src/" + name, "utf8") !== fs.readFileSync("app/src/" + name, "utf8")) throw new Error("Workspace frontend diverged: " + name);
            }
            console.log("Both frontend source trees have the same shared helpers and workspace UI.");
          '
