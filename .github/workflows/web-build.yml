name: LUQI Web Build

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install exactly as Railway web image
        run: npm ci --legacy-peer-deps --include=dev
      - name: Verify persistent database configuration contracts
        run: npx vitest run tests/mysql-config.test.ts tests/ai-provider-contract.test.ts tests/ai-pilot-budget.test.ts tests/ai-pilot-auth.test.ts tests/user-token.test.ts tests/auth-input.test.ts tests/legacy-ai-budget-guard.test.ts tests/http-guard.test.ts tests/gemini-pilot-compat.test.ts tests/production-mysql-bootstrap.test.ts tests/self-healing-truth.test.ts tests/legacy-payments-closed.test.ts tests/billing-dashboard-truth.test.ts tests/workspace-truth.test.ts tests/pilot-credential-check.test.ts tests/account-recovery.test.ts tests/private-conversations.test.ts tests/companion-client.test.ts tests/companion-page.test.tsx tests/dependency-audit.test.ts tests/legacy-admin.test.ts tests/admin-status-ui.test.tsx tests/legacy-operations.test.ts tests/service-worker-status.test.ts tests/omega-tasks.test.ts tests/omega-dashboard-client.test.ts tests/omega-dashboard-page.test.tsx
      - name: Type-check Omega dashboard and client
        run: npx tsc --noEmit --strict --skipLibCheck --jsx react-jsx --target es2022 --module esnext --moduleResolution bundler --esModuleInterop src/pages/OmegaTasksPage.tsx src/lib/omega-tasks.ts
      - name: Run integrity gate
        run: node scripts/verify-build.mjs
      - name: Build public UI and API bundle
        run: npm run build
      - name: Install Chromium for browser checks
        run: npx playwright install --with-deps chromium --only-shell
      - name: Verify desktop and mobile browser flows with synthetic API fixtures
        run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failure-evidence
          path: test-results/
      - name: Verify deployment entrypoints
        run: test -s dist/boot.js && test -s dist/public/index.html && test -s dist/reset-account-password.js
      - name: Verify recovery terminal safety
        run: python scripts/ci-recovery-cli.py
      - name: Smoke-test production HTTP health endpoint
        env:
          NODE_ENV: production
          PORT: "8765"
          JWT_SECRET: "ci-health-check-only-ephemeral-secret-123456"
        run: |
          node dist/boot.js > /tmp/luqi-health.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent --show-error http://127.0.0.1:8765/v1/health > /tmp/luqi-health.json; then
              cat /tmp/luqi-health.json
              grep -q '"status":"healthy"' /tmp/luqi-health.json
              node --input-type=module -e '
                for (const [path, code] of [["/api/v1/admin/verify", "ADMIN_SESSION_UNAVAILABLE"], ["/api/v1/system-api-matrix", "PROVIDER_TELEMETRY_UNAVAILABLE"], ["/api/v1/audit/seal", "LEGACY_OPERATION_UNAVAILABLE"], ["/api/v1/audit/ledger", "LEGACY_OPERATION_UNAVAILABLE"], ["/api/v1/offline-sync/bundle", "LEGACY_OPERATION_UNAVAILABLE"], ["/api/v1/grading/ledger/other-account", "LEGACY_OPERATION_UNAVAILABLE"], ["/security/diagnostics", "LEGACY_OPERATION_UNAVAILABLE"]]) {
                  const response = await fetch("http://127.0.0.1:8765" + path);
                  const body = await response.json();
                  if (response.status !== 503 || response.headers.get("cache-control") !== "no-store" || body.code !== code) throw new Error("Legacy admin boundary failed: " + path);
                  console.log(path + " rejects unavailable admin/telemetry access");
                }
                for (const path of ["/api/v1/omega/tasks", "/api/v1/omega/tasks/status"]) {
                  const response = await fetch("http://127.0.0.1:8765" + path);
                  if (response.status !== 401 || response.headers.get("cache-control") !== "no-store" ||
                      (await response.json()).code !== "AUTH_REQUIRED") throw new Error("Omega auth boundary failed");
                  console.log(path + " requires authenticated account access");
                }
              '
              exit 0
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              cat /tmp/luqi-health.log
              exit 1
            fi
            sleep 1
          done
          cat /tmp/luqi-health.log
          exit 1
      - name: Verify shared frontend helpers in both source trees
        run: |
          node --input-type=module -e '
            import fs from "node:fs";
            for (const name of ["api.ts", "utils.ts", "languages.ts"]) {
              const a = fs.readFileSync("src/lib/" + name, "utf8");
              const b = fs.readFileSync("app/src/lib/" + name, "utf8");
              if (a !== b) {
                throw new Error("Frontend shared helper diverged: " + name);
              }
            }
            for (const name of ["components/WorkspaceLayout.tsx", "components/HeroAiChatConsole.tsx", "components/workspace-catalog.ts", "pages/Home.tsx", "pages/ServiceStatusPage.tsx", "pages/PendulumLabPage.tsx", "workspace.css", "omega-tasks.css", "pages/OmegaTasksPage.tsx", "lib/omega-tasks.ts"]) {
              if (fs.readFileSync("src/" + name, "utf8") !== fs.readFileSync("app/src/" + name, "utf8")) throw new Error("Workspace frontend diverged: " + name);
            }
            console.log("Both frontend source trees have the same shared helpers and workspace UI.");
          '
