name: LUQI Member Ledger Isolation
on:
  pull_request:
    branches: [main]
    paths:
      - 'api/services/memberEntitlementRead.ts'
      - 'db/migrations/20261025_member_entitlements.sql'
      - 'docs/MEMBER_ENTITLEMENT_GATE_2026_10_25.md'
      - 'tests/member-entitlement-*.ts'
      - '.github/workflows/member-ledger-isolation.yml'
permissions:
  contents: read
jobs:
  default-deny-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --legacy-peer-deps --include=dev
      - name: Strictly type-check disconnected read-only membership candidate
        run: npx tsc --noEmit --strict --skipLibCheck --target es2022 --module esnext --moduleResolution bundler --esModuleInterop api/services/memberEntitlementRead.ts
      - name: Prove default off and fail-closed records without a database
        run: npx vitest run tests/member-entitlement-read.test.ts --no-file-parallelism
      - name: Prove no subscription activation or runtime router wiring
        run: |
          node - <<'NODE'
          const fs=require('node:fs');
          const read=p=>fs.readFileSync(p,'utf8');
          const sql=read('db/migrations/20261025_member_entitlements.sql');
          if (/\b(?:DROP|TRUNCATE|ALTER)\s+TABLE\b/i.test(sql)) process.exit(1);
          const router=read('api/boot.ts');
          const gateway=read('api/services/aiPilotGateway.ts');
          const payments=read('api/rest-compat.ts');
          const forbidden='memberEntitlementRead';
          if ([router,gateway,payments].some(c=>c.includes(forbidden))) process.exit(2);
          console.log('No live route, paid provider hook, migration runner or wallet activation');
          NODE
  isolated-mysql-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci-only-membership-password
          MYSQL_DATABASE: luqi_member_ci
        ports: ['3306:3306']
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -pci-only-membership-password"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: mysql://root:ci-only-membership-password@127.0.0.1:3306/luqi_member_ci
      LUQI_MEMBER_LEDGER_CI_FIXTURE: 'true'
      LUQI_AI_PROVIDER_ENABLED: 'false'
      LUQI_AI_BILLING_APPROVED: 'false'
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --legacy-peer-deps --include=dev
      - name: Test synthetic receipt and entitlement isolation only
        run: npx vitest run tests/member-entitlement-mysql.integration.test.ts --no-file-parallelism
      - name: Record scope
        run: echo 'No real payment/merchant receipt, account, provider inference, production SQL, migration or entitlement activation was performed.' >> "$GITHUB_STEP_SUMMARY"
