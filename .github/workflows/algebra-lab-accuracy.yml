name: LUQI Algebra Lab Accuracy
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - 'public/labs/algebra*'
      - 'tests/algebra-math.test.mjs'
      - '.github/workflows/algebra-lab-accuracy.yml'
permissions:
  contents: read
jobs:
  local-algebra-calculations:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: node --check public/labs/algebra-math.js
      - run: node --test tests/algebra-math.test.mjs
