name: Luqi Launch Control Acceptance
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: launch-control-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify-launch-control:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --legacy-peer-deps --include=dev
      - name: Verify dependency gates, checkpoint integrity, bounded live probes and email preflight
        run: npx vitest run tests/launch-engine.test.ts tests/email-preflight.test.ts tests/launch-control-page.test.tsx
      - name: Strictly type-check the complete launch workbench
        run: npx tsc --noEmit --strict --skipLibCheck --jsx react-jsx --target es2022 --module esnext --moduleResolution bundler --esModuleInterop src/features/launch/LaunchControlPage.tsx
