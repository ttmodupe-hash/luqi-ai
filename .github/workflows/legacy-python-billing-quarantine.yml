name: LUQI Legacy Python Billing Quarantine (NO DEPLOY)
on:
  push:
    branches: ["security/quarantine-legacy-python-billing-*"]
  pull_request:
    branches: ["integration/luqi-foundation-*"]
permissions:
  contents: read
jobs:
  legacy-billing-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install FastAPI route test requirements
        run: python -m pip install fastapi==0.111.0 httpx==0.28.1
      - name: Validate syntax and imports without billing credentials
        run: python -m compileall -q backend/legacy_route_security.py backend/async_job_routes.py token_billing_gateway.py main.py tests/test_legacy_python_billing_quarantine.py
      - name: Verify unsigned payments and spoofed account operations cannot execute
        env:
          PAYFAST_TEST_MODE: "true"
        run: python -m unittest discover -s tests -p test_legacy_python_billing_quarantine.py -v
