name: LUQI Official Opportunity Publisher Watch
on:
  schedule:
    # Two read-only checks per day. GitHub schedules may be delayed.
    - cron: '13 5,17 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  read-official-sources:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check deployed official-source monitor without accounts or AI
        run: |
          python3 - <<'PY'
          import json, urllib.request, urllib.error, datetime
          from pathlib import Path
          url = 'https://app.luqi-ai.com/api/v1/opportunity-watch'
          report = {'checked_at': datetime.datetime.now(datetime.timezone.utc).isoformat(), 'scope':'publisher-pages-only','state':'unavailable','sources':[]}
          try:
              req = urllib.request.Request(url, headers={'Accept':'application/json','User-Agent':'LuqiGithubReadOnlyPublisherWatch/1.0'}, method='GET')
              with urllib.request.urlopen(req, timeout=25) as res:
                  if res.status != 200:
                      raise ValueError('Monitor HTTP status not successful')
                  raw = res.read(8193)
                  if len(raw) > 8192:
                      raise ValueError('Unexpected oversized monitor response')
                  data = json.loads(raw)
              if data.get('status') != 'sources_checked' or data.get('scope') != 'publisher-pages-only':
                  raise ValueError('Unexpected publisher-check schema')
              sources = data.get('sources')
              if not isinstance(sources, list) or len(sources) != 3:
                  raise ValueError('Unexpected publisher list')
              ids = {v.get('id') for v in sources if isinstance(v, dict)}
              if ids != {'gov-jobs','nyda','nrf'} or any(v.get('status') not in {'reachable','unavailable'} for v in sources):
                  raise ValueError('Unexpected publisher data')
              report = {'checked_at':data.get('checkedAt'),'scope':'publisher-pages-only','state':'checked','sources':[
                  { 'id':v['id'], 'status':v['status'], **({'publication':v['publication']} if isinstance(v.get('publication'),str) and len(v['publication'])<100 else {}) }
                  for v in sources ]}
              for item in report['sources']:
                  print(item['id'] + ': ' + item['status'] + ((' — ' + item['publication']) if 'publication' in item else ''))
              print('Publisher reachability and circular number are NOT verified open vacancies.')
          except (ValueError, urllib.error.URLError, TimeoutError, OSError, json.JSONDecodeError, KeyError, TypeError) as e:
              print('::warning::Official publisher monitor unavailable: ' + type(e).__name__)
          Path('opportunity-source-watch.json').write_text(json.dumps(report,indent=2),encoding='utf-8')
          PY
      - name: Retain bounded source-status evidence
        uses: actions/upload-artifact@v4
        with:
          name: opportunity-source-watch
          path: opportunity-source-watch.json
          retention-days: 14
          if-no-files-found: error
