name: LUQI Official Opportunity Publisher Watch
on:
  schedule:
    # Two read-only checks per day. GitHub schedules may be delayed.
    - cron: '13 5,17 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  read-official-sources:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check deployed official-source monitor without accounts or AI
        run: |
          python3 - <<'PY'
          import json, urllib.request, urllib.error, datetime
          from pathlib import Path
          url = 'https://app.luqi-ai.com/api/v1/opportunity-watch'
          report = {'checked_at': datetime.datetime.now(datetime.timezone.utc).isoformat(), 'scope':'publisher-pages-only','state':'unavailable','sources':[]}
          try:
              req = urllib.request.Request(url, headers={'Accept':'application/json','User-Agent':'LuqiGithubReadOnlyPublisherWatch/1.0'}, method='GET')
              with urllib.request.urlopen(req, timeout=25) as res:
                  if res.status != 200:
                      raise ValueError('Monitor HTTP status not successful')
                  raw = res.read(8193)
                  if len(raw) > 8192:
                      raise ValueError('Unexpected oversized monitor response')
                  data = json.loads(raw)
              if data.get('status') != 'sources_checked' or data.get('scope') != 'publisher-pages-only':
                  raise ValueError('Unexpected publisher-check schema')
              sources = data.get('sources')
              if not isinstance(sources, list) or len(sources) != 3:
                  raise ValueError('Unexpected publisher list')
              ids = {v.get('id') for v in sources if isinstance(v, dict)}
              if ids != {'gov-jobs','nyda','nrf'} or any(v.get('status') not in {'reachable','unavailable'} for v in sources):
                  raise ValueError('Unexpected publisher data')
              report = {'checked_at':data.get('checkedAt'),'scope':'publisher-pages-only','state':'checked','sources':[
                  { 'id':v['id'], 'status':v['status'], **({'publication':v['publication']} if isinstance(v.get('publication'),str) and len(v['publication'])<100 else {}) }
                  for v in sources ]}
              for item in report['sources']:
                  print(item['id'] + ': ' + item['status'] + ((' — ' + item['publication']) if 'publication' in item else ''))
              print('Publisher reachability and circular number are NOT verified open vacancies.')
          except (ValueError, urllib.error.URLError, TimeoutError, OSError, json.JSONDecodeError, KeyError, TypeError) as e:
              print('::warning::Official publisher monitor unavailable: ' + type(e).__name__)
          # A separate, bounded evidence check for curated INDIVIDUAL job adverts.
          # Text matching is NOT employer acceptance, a live job offer or eligibility.
          report['individual_adverts'] = {'state':'unavailable','checks':[]}
          try:
              notice_url = 'https://app.luqi-ai.com/api/v1/opportunity-watch/notices'
              notice_req = urllib.request.Request(notice_url,headers={'Accept':'application/json','User-Agent':'LuqiOfficialJobSourceWatch/1.0'},method='GET')
              with urllib.request.urlopen(notice_req,timeout=30) as res:
                  if res.status != 200: raise ValueError('Notice endpoint unavailable')
                  raw = res.read(16385)
                  if len(raw) > 16384: raise ValueError('Oversized notice response')
                  result = json.loads(raw)
              if result.get('scope') != 'fixed_official_individual_adverts_only':
                  raise ValueError('Invalid notice scope')
              notices=result.get('checks')
              valid={'reference-and-deadline-found','content-unconfirmed','publisher-unavailable','withdrawn'}
              if not isinstance(notices,list) or len(notices)<7 or len(notices)>30:
                  raise ValueError('Unexpected notice count')
              ids=set()
              for notice in notices:
                  if not isinstance(notice,dict) or notice.get('state') not in valid or notice.get('note')!='text_evidence_only_not_live_availability':
                      raise ValueError('Untrusted notice check')
                  identity=notice.get('id')
                  if not isinstance(identity,str) or len(identity)>120 or identity in ids:raise ValueError('Duplicate notice')
                  ids.add(identity)
              report['individual_adverts']={'state':'source_text_checked','checked_at':result.get('checkedAt'),
                  'checks':[{'id':n['id'],'state':n['state']} for n in notices]}
              for notice in report['individual_adverts']['checks']:
                  print('Individual advert '+notice['id']+': '+notice['state'])
              print('Individual reference and date matches do NOT confirm any vacancy is still open.')
          except (ValueError,urllib.error.URLError,TimeoutError,OSError,json.JSONDecodeError,TypeError,KeyError) as e:
              print('::warning::Individual job source recheck unavailable: '+type(e).__name__)
          Path('opportunity-source-watch.json').write_text(json.dumps(report,indent=2),encoding='utf-8')
          PY
      - name: Retain bounded source-status evidence
        uses: actions/upload-artifact@v7
        with:
          name: opportunity-source-watch
          path: opportunity-source-watch.json
          retention-days: 14
          if-no-files-found: error
