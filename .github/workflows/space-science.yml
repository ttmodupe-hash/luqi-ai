name: Luqi Space Science
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: space-science-${{ github.ref }}
  cancel-in-progress: true
jobs:
  science-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Check deterministic science, source boundaries, privacy and mirrors
        run: node --experimental-strip-types --test tests/space-science.test.mjs
      - name: Install existing locked dependencies
        run: npm ci --legacy-peer-deps --include=dev --ignore-scripts
      - name: Strictly type-check both frontend implementations
        run: npx --no-install tsc --noEmit --strict --skipLibCheck --jsx react-jsx --target es2022 --module esnext --moduleResolution bundler --esModuleInterop src/pages/SpaceSciencePage.tsx app/src/pages/SpaceSciencePage.tsx
      - name: Exercise source filters, calculator errors, practice and download cleanup
        run: npx --no-install vitest run tests/space-science-page.test.tsx
      - name: Record acceptance boundary
        run: echo 'Synthetic unit/DOM checks only. Full Chromium/WebKit browser journeys remain required; no customer accounts or paid inference.' >> "$GITHUB_STEP_SUMMARY"
