name: LUQI African Biblical Study
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: african-biblical-study-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify-sources-and-learning:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Validate source contracts, content distinctions and mirrored integration
        run: node --test tests/africa-biblical-study.test.mjs
      - name: Install locked test dependencies without lifecycle scripts
        run: npm ci --legacy-peer-deps --ignore-scripts
      - name: Exercise reading, quiz, source links and expired editions
        run: npx --no-install vitest run tests/africa-biblical-study.test.tsx
      - name: Strictly type check the study component
        run: npx --no-install tsc --noEmit --strict --skipLibCheck --jsx react-jsx --target es2022 --module esnext --moduleResolution bundler --esModuleInterop src/components/AfricanBiblicalStudy.tsx
      - name: Build the actual frontend without production credentials
        run: npx --no-install vite build
      - name: Install isolated Chromium and WebKit acceptance browsers
        timeout-minutes: 15
        run: npx --no-install playwright install --with-deps chromium webkit
      - name: Exercise all topics and evidence views with quiz feedback at desktop and phone widths
        run: node scripts/frontend-feature-acceptance.mjs history
      - name: Preserve browser screenshots and exact test revision
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: history-browser-acceptance
          path: artifacts/feature-acceptance/history/
          retention-days: 7
          if-no-files-found: warn
