name: LUQI Digital Manager Visual Acceptance
on:
  pull_request:
    branches: [main]
    paths: ['src/components/CivicWardGuide.tsx','app/src/components/CivicWardGuide.tsx','src/components/civic-manager.css','app/src/components/civic-manager.css','src/features/drive/FieldNotebook.tsx','app/src/features/drive/FieldNotebook.tsx','src/features/drive/drive-manager.css','app/src/features/drive/drive-manager.css','tests/civic-ward-guide.test.tsx','browser-tests/drive-digital-manager.spec.ts','.github/workflows/drive-digital-manager.yml']
  push:
    branches: [main]
    paths: ['src/components/CivicWardGuide.tsx','app/src/components/CivicWardGuide.tsx','src/components/civic-manager.css','app/src/components/civic-manager.css','src/features/drive/FieldNotebook.tsx','app/src/features/drive/FieldNotebook.tsx','src/features/drive/drive-manager.css','app/src/features/drive/drive-manager.css','tests/civic-ward-guide.test.tsx','browser-tests/drive-digital-manager.spec.ts','.github/workflows/drive-digital-manager.yml']
permissions:
  contents: read
jobs:
  visual-and-functional-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --legacy-peer-deps --include=dev --ignore-scripts
      - name: Preserve source content, interactions, GPS and notebook contracts
        run: npx --no-install vitest run tests/civic-ward-guide.test.tsx tests/luqi-drive-gps.test.tsx tests/field-and-bench.test.tsx
      - name: Check both production component copies
        run: npx --no-install tsc --noEmit --strict --skipLibCheck --jsx react-jsx --target es2022 --module esnext --moduleResolution bundler --esModuleInterop src/components/CivicWardGuide.tsx app/src/components/CivicWardGuide.tsx src/features/drive/FieldNotebook.tsx app/src/features/drive/FieldNotebook.tsx
      - name: Build actual application
        run: npx --no-install vite build
      - name: Desktop, narrow-mobile, keyboard, download and privacy journeys
        run: |
          browser="$(command -v google-chrome || command -v chromium || true)"
          if [ -n "$browser" ]; then
            export LUQI_CHROMIUM_PATH="$browser"
          else
            npx --no-install playwright install --with-deps chromium --only-shell
          fi
          npx --no-install playwright test browser-tests/drive-digital-manager.spec.ts --workers=1
      - name: Retain actual rendered visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: luqi-digital-manager-review
          path: test-results/
          if-no-files-found: error
