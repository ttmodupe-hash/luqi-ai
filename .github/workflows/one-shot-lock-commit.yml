name: One-time LUQI Lockfile Repair
on:
  push:
    branches: [security/drizzle-0454-fix-20261022]
    paths:
      - ".github/workflows/one-shot-lock-commit.yml"

permissions:
  contents: write

jobs:
  repair:
    if: github.repository == 'ttmodupe-hash/luqi-ai' && github.ref == 'refs/heads/security/drizzle-0454-fix-20261022'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: security/drizzle-0454-fix-20261022
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Generate lockfile metadata without executing dependency scripts
        run: npm install --package-lock-only --ignore-scripts --legacy-peer-deps --no-audit --no-fund
      - name: Commit resolved lockfile only to isolated reviewed branch
        shell: bash
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "Lockfile is already synchronized"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- package-lock.json
          git diff --cached --check
          git diff --cached --stat
          git commit -m "chore(deps): repair complete reproducible lock for patched Drizzle"
          git push origin HEAD:refs/heads/security/drizzle-0454-fix-20261022
