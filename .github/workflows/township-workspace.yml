name: Township Business Workspace Acceptance
on:
  pull_request:
    branches: [main]
    paths:
      - 'src/pages/TownshipEconomyPage.tsx'
      - 'app/src/pages/TownshipEconomyPage.tsx'
      - '**/TownshipBusinessWorkspace.tsx'
      - '**/township-workspace.ts'
      - '**/business-desk.ts'
      - 'tests/township*.test.ts'
      - 'browser-tests/township-business-workspace.spec.ts'
      - 'playwright.township.config.ts'
      - '.github/workflows/township-workspace.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: township-workspace-${{ github.ref }}
  cancel-in-progress: true
jobs:
  acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --legacy-peer-deps --include=dev --ignore-scripts
      - name: Source preservation, project validation and business arithmetic
        run: npx --no-install vitest run tests/township-workspace.test.ts tests/township-economy.test.ts tests/business-desk.test.ts
      - name: Typecheck both frontend implementations
        run: npx --no-install tsc --noEmit --strict --skipLibCheck --jsx react-jsx --target ES2022 --module ESNext --moduleResolution bundler --esModuleInterop src/pages/TownshipEconomyPage.tsx app/src/pages/TownshipEconomyPage.tsx
      - run: npm run build
      - name: Real local browser journeys, no production accounts or inference
        run: |
          image='mcr.microsoft.com/playwright:v1.58.2-noble@sha256:6446946a1d9fd62d9ae501312a2d76a43ee688542b21622056a372959b65d63d'
          docker run --rm --init --ipc host -v "$PWD:/work" -w /work \
            -e PLAYWRIGHT_BROWSERS_PATH=/ms-playwright -e CI=true \
            -e LUQI_AI_PROVIDER_ENABLED=false -e LUQI_AI_BILLING_APPROVED=false \
            "$image" npx --no-install playwright test --config=playwright.township.config.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: township-workspace-acceptance
          path: |
            test-results/
            playwright-report/
          retention-days: 7
