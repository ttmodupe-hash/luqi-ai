# Production deployment is intentionally disabled until the verified target,
# workload identity, secret references, rollback and staging gates are configured.
# This workflow cannot deploy or mutate DNS.
name: LUQI Production Deployment Guard
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deployment-guard:
    runs-on: ubuntu-latest
    steps:
      - name: Block unsafe legacy deployment
        run: |
          echo "::error::Production deployment disabled: verify GCP project, Cloud Run region/service, Artifact Registry, workload identity, secrets, staging tests and rollback."
          exit 1
