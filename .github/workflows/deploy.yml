# LEGACY GOOGLE CLOUD DEPLOYMENT RETIRED. Railway is the current LUQI web host.
# Explicit dispatch is a refusal, not authorization to deploy or access secrets.
name: LUQI Legacy GCP Deployment Disabled
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  disabled:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Refuse obsolete production deployment
        run: |
          echo "Legacy GCP deployment is retired. Use a separately reviewed, approved target-specific release process."
          exit 1
