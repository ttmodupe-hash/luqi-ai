name: LUQI Public Release Checks

on:
  push:
    branches: [main]
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "scripts/verify-public-release.mjs"
      - "scripts/verify-deployed-release.mjs"
      - "api/lib/releaseIdentity.ts"
      - "tests/release-identity.test.ts"
      - "tests/release-observation.test.ts"
      - ".github/workflows/public-release-checks.yml"

permissions:
  contents: read

concurrency:
  group: luqi-public-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-current-public-release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check probe syntax
        run: |
          node --check scripts/verify-public-release.mjs
          node --check scripts/verify-deployed-release.mjs
      - name: Wait for the expected live commit and verify its public safety boundaries
        if: github.event_name != 'pull_request'
        env:
          LUQI_VERIFY_PUBLIC: "true"
          LUQI_EXPECTED_COMMIT: ${{ github.sha }}
        run: node scripts/verify-deployed-release.mjs
