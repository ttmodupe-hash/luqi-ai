name: LUQI Public Release Checks

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "scripts/verify-public-release.mjs"
      - ".github/workflows/public-release-checks.yml"

permissions:
  contents: read

jobs:
  verify-current-public-release:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check probe syntax
        run: node --check scripts/verify-public-release.mjs
      - name: Verify fixed public Railway origin with no spending or credentials
        env:
          LUQI_VERIFY_PUBLIC: "true"
        run: node scripts/verify-public-release.mjs
