name: LUQI Release Preflight (no deployment)
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies (lockfile must be consistent)
        run: npm ci --no-audit --no-fund
      - name: TypeScript
        run: npm run check
      - name: Unit tests
        run: npm test
      - name: Production build
        run: npm run build
      - name: Confirm no deployment occurred
        run: echo "Preflight only; this workflow never deploys or edits DNS."
