name: LUQI One Approved Production Pilot Check

on:
  push:
    branches: [ops/production-pilot-check-20261024]
    paths: ['.github/workflows/production-pilot-once.yml']

permissions:
  contents: read

concurrency:
  group: luqi-one-approved-pilot-20261024A
  cancel-in-progress: false

jobs:
  verify-one-journey:
    if: >-
      github.repository == 'ttmodupe-hash/luqi-ai' &&
      github.ref == 'refs/heads/ops/production-pilot-check-20261024' &&
      github.event.head_commit.message == 'ops: run one owner-approved production pilot check 20261024A' &&
      github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check probe syntax and all offline safety fixtures
        run: |
          node --check scripts/verify-production-pilot.mjs
          node --test tests/production-pilot-probe.test.mjs
      # The owner approved production acceptance and the existing $100 pilot.
      # One synthetic account, one note, one HTTP inference request. The server
      # retains its existing independent fallback reservation and monthly caps.
      # No provider/admin/DB secrets; no retries, invoices or customer charges.
      - name: Exercise normal production account and one budgeted AI request
        env:
          LUQI_ACCEPTANCE_WRITES: owner-approved-synthetic-only
          LUQI_ACCEPTANCE_AI: one-request
          LUQI_EXPECTED_COMMIT: 2bb5ac2686d921cebffea246c383bb36e6e92f6e
        run: node scripts/verify-production-pilot.mjs
