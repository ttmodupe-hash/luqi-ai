name: Luqi Audit Repair Workbench
on:
  push:
    branches: [fix/luqi-interaction-audit-20261101]
    paths: [.github/workflows/audit-repair-workbench.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fce69a68a36ab48621d48cbf1aceb706c67521aa
          persist-credentials: false
      - name: Export exact audited public application tree
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = fce69a68a36ab48621d48cbf1aceb706c67521aa
          git archive --format=tar.gz --output=/tmp/luqi-audit-source.tar.gz HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: luqi-audit-source
          path: /tmp/luqi-audit-source.tar.gz
          retention-days: 1
          if-no-files-found: error
