name: Luqi Audit Repair Workbench
on:
  push:
    branches: [fix/luqi-interaction-audit-20261101]
    paths: [.github/workflows/audit-repair-workbench.yml]
permissions:
  contents: write
concurrency:
  group: luqi-audit-repair-apply
  cancel-in-progress: false
jobs:
  apply:
    if: github.repository == 'ttmodupe-hash/luqi-ai' && github.ref == 'refs/heads/fix/luqi-interaction-audit-20261101'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Apply only hash-verified public application edits
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, hashlib, json, lzma, pathlib, subprocess
          root = pathlib.Path.cwd()
          packed = ''.join((root / f'.github/luqi-audit-edits-{i}.b64').read_text().strip() for i in range(1,4))
          raw = lzma.decompress(base64.b64decode(packed, validate=True))
          assert hashlib.sha256(raw).hexdigest() == '9da557fcd3de3d44227085b4891b86573b939e9b1c90e4223bce6b31c6ea964e', 'Instruction digest mismatch'
          records = json.loads(raw)
          assert isinstance(records, list) and len(records) == 33
          paths = []
          for record in records:
              name = record['path']
              path = pathlib.PurePosixPath(name)
              assert not path.is_absolute() and '..' not in path.parts
              assert path.parts[0] in ('src','tests','browser-tests','docs') or name == '.github/workflows/interaction-audit.yml'
              target = root / name
              assert not target.is_symlink()
              old = target.read_text() if target.exists() else ''
              before = record['before']
              assert (not target.exists()) if before is None else hashlib.sha256(old.encode()).hexdigest() == before, name
              lines = old.splitlines(keepends=True)
              for start, stop, replacement in reversed(record['edits']):
                  assert 0 <= start <= stop <= len(lines)
                  lines[start:stop] = replacement.splitlines(keepends=True)
              new = ''.join(lines)
              assert hashlib.sha256(new.encode()).hexdigest() == record['after'], name
              # Workflow changes are applied separately through the approved connector.
              if name.startswith('.github/'):
                  continue
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_text(new)
              paths.append(name)
              if name.startswith('src/'):
                  mirror = root / 'app' / name
                  mirror.parent.mkdir(parents=True, exist_ok=True)
                  mirror.write_text(new)
                  paths.append('app/' + name)
          assert len(paths) == len(set(paths))
          subprocess.run(['git','add','-f','--',*paths], check=True)
          subprocess.run(['git','diff','--cached','--check'], check=True)
          print('Verified repair paths:', len(paths))
          print('\n'.join(paths))
          PY
      - name: Commit and fast-forward only the isolated repair branch
        shell: bash
        run: |
          set -euo pipefail
          branch=fix/luqi-interaction-audit-20261101
          test "$(git ls-remote origin refs/heads/$branch | cut -f1)" = "$(git rev-parse HEAD)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(luqi): align selections, preserve drafts and report output state honestly'
          git push origin HEAD:refs/heads/$branch
          git rev-parse HEAD
