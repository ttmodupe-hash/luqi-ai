name: LUQI Approved Homepage Experience
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: luqi-approved-home-${{ github.ref }}
  cancel-in-progress: true
jobs:
  screenshot-home-functional:
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.58.2-noble@sha256:6446946a1d9fd62d9ae501312a2d76a43ee688542b21622056a372959b65d63d
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
      - name: Install locked dependencies
        run: npm ci --legacy-peer-deps
      - name: Test navigation, source-linked history and real tool targets
        run: npx --no-install vitest run tests/luqi-screenshot-home.test.tsx
      - name: Build public Luqi frontend without AI credentials
        run: npm run build
      - name: Verify screenshot-target desktop and mobile Chromium
        run: npx --no-install playwright test --config=playwright.config.ts browser-tests/approved-home-panorama.spec.ts
      - name: Verify screenshot-target desktop and iPhone-sized WebKit
        run: npx --no-install playwright test --config=playwright.webkit.config.ts browser-tests/approved-home-panorama.spec.ts
      - name: Retain actual screenshots and failed browser traces
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: approved-home-browser-evidence
          path: |
            test-results/
            test-results-webkit/
          retention-days: 7
          if-no-files-found: warn
