name: Omega Durable MySQL

on:
  pull_request:
    branches: [main]
    paths:
      - "omega_ai/**"
      - "tests/test_omega_*.py"
      - "tests/conftest.py"
      - "requirements.txt"
      - "api/omega-tasks.ts"
      - "api/services/omegaTask*.ts"
      - "api/services/pilotAuth.ts"
      - "api/lib/userToken.ts"
      - "api/queries/connection.ts"
      - "api/boot.ts"
      - "tests/omega-*.test.ts"
      - "tests/fixtures/omega-web-contracts.json"
      - "package.json"
      - "package-lock.json"
      - "db/migrations/20261023_omega_tasks.sql"
      - ".github/workflows/omega-mysql.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  durable-worker-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci-ephemeral-only-password
          MYSQL_DATABASE: luqi_omega_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -pci-ephemeral-only-password"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      # Tests refuse non-CI execution and only connect to a hardcoded local
      # fixture. No Railway URL, secret or AI-provider key is used by this job.
      LUQI_OMEGA_MYSQL_CI_FIXTURE: "true"
      LUQI_AI_PROVIDER_ENABLED: "false"
      LUQI_AI_BILLING_APPROVED: "false"
      DATABASE_URL: "mysql://root:ci-ephemeral-only-password@127.0.0.1:3306/luqi_omega_ci"
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      # Avoid the optional npm cache: storage egress failures stalled setup
      # for 10 minutes. npm ci installs from the committed lockfile below.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install fixture dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "PyMySQL[rsa]==1.2.3" pytest
      - name: Test real MySQL migrations, independent processes and crash recovery
        run: python -m pytest -o addopts='' -v tests/test_omega_mysql_contract.py tests/test_omega_mysql_integration.py tests/test_omega_web_worker.py
      - name: Install Node bridge dependencies
        run: npm ci --legacy-peer-deps --include=dev
      - name: Test signed accounts, durable quota and Node to Python round trips
        run: npx vitest run tests/omega-tasks.test.ts tests/omega-web-mysql.integration.test.ts --no-file-parallelism
