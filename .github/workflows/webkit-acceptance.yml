name: LUQI WebKit Launch Acceptance
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: webkit-acceptance-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify-webkit-journeys:
    # The locked Playwright 1.58.2 does not support WebKit on Ubuntu 26.04.
    # Avoid ubuntu-latest migration changing the browser test platform silently.
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Verify recorder capability detection offline
        run: node --experimental-strip-types --test tests/recording-support.test.mjs
      - name: Install locked application and test dependencies
        run: npm ci --legacy-peer-deps --include=dev
      - name: Install the WebKit binary matching the locked Playwright version
        timeout-minutes: 5
        run: npx --no-install playwright install --with-deps webkit
      - name: Build the same web application without provider credentials
        run: npm run build
      - name: Verify resolved loading policy and emitted public entrypoint
        run: node scripts/verify-module-loading.mjs
      - name: Run existing account, trial and tool journeys on desktop and iPhone-sized WebKit
        timeout-minutes: 8
        run: npx --no-install playwright test --config=playwright.webkit.config.ts
      - name: Preserve synthetic test results and failure evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: webkit-launch-acceptance
          path: test-results-webkit/
          retention-days: 7
          if-no-files-found: warn
