name: LUQI WebKit Launch Acceptance
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: webkit-acceptance-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  verify-webkit-journeys:
    name: verify-${{ matrix.project }}-journeys
    strategy:
      fail-fast: false
      matrix:
        project: [webkit-desktop, webkit-iphone]
    # The locked Playwright 1.58.2 does not support WebKit on Ubuntu 26.04.
    # Avoid ubuntu-latest migration changing the browser test platform silently.
    runs-on: ubuntu-24.04
    # Browser+OS dependencies are preinstalled in the digest-pinned official
    # Playwright image; this avoids flaky public APT/CDN downloads.
    container:
      image: mcr.microsoft.com/playwright:v1.58.2-noble@sha256:6446946a1d9fd62d9ae501312a2d76a43ee688542b21622056a372959b65d63d
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Verify recorder capability detection offline
        run: node --experimental-strip-types --test tests/recording-support.test.mjs
      - name: Install locked application and test dependencies
        run: npm ci --legacy-peer-deps --include=dev
      - name: Verify the digest-pinned, lockfile-matched WebKit engine
        run: |
          test "$(node -p "require('@playwright/test/package.json').version")" = "1.58.2"
          test "$PLAYWRIGHT_BROWSERS_PATH" = "/ms-playwright"
          test -d /ms-playwright
          npx --no-install playwright --version
      - name: Build the same web application without provider credentials
        run: npm run build
      - name: Verify resolved loading policy and emitted public entrypoint
        run: node scripts/verify-module-loading.mjs
      - name: Run existing account, trial and tool journeys on desktop and iPhone-sized WebKit
        # Keep every desktop + iPhone journey: 421/434 passed before the prior 12m
        # global cap. The 15m Playwright cap and 16m step remain bounded by 20m job.
        timeout-minutes: 16
        run: npx --no-install playwright test --config=playwright.webkit.config.ts --project=${{ matrix.project }}
      - name: Preserve synthetic test results and failure evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: webkit-launch-acceptance-${{ matrix.project }}
          path: test-results-webkit/
          retention-days: 7
          if-no-files-found: warn
