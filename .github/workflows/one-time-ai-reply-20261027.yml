name: LUQI one-time authenticated production AI reply acceptance
on:
  push:
    branches: ['acceptance/one-time-live-ai-f1240c-20261027']
    paths: ['.github/workflows/one-time-ai-reply-20261027.yml']
permissions:
  contents: read
concurrency:
  group: luqi-one-time-ai-acceptance-20261027
  cancel-in-progress: false
jobs:
  live-reply:
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/acceptance/one-time-live-ai-f1240c-20261027' &&
      github.event.head_commit.message == 'chore(acceptance): one authenticated production AI reply probe 2026-10-27' &&
      github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify existing audited acceptance script syntax
        run: node --check scripts/verify-production-pilot.mjs
      - name: Run one account-owned synthetic production journey and one budgeted provider attempt
        env:
          LUQI_EXPECTED_COMMIT: 'f1240c04cb890ed3d7a798df184ecfce7534095e'
          LUQI_ACCEPTANCE_WRITES: 'owner-approved-synthetic-only'
          LUQI_ACCEPTANCE_AI: 'one-request'
        run: node scripts/verify-production-pilot.mjs
