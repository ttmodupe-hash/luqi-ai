name: LUQI Staging Provider Readiness (No Charges)
on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type VERIFY_ONLY_NO_CHARGES to authorize read-only staging preflight"
        required: true
        type: string
permissions:
  contents: read
jobs:
  provider-preflight:
    if: github.event.inputs.confirmation == 'VERIFY_ONLY_NO_CHARGES'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: staging
    env:
      LUQI_RUNTIME_ENV: staging
      LUQI_STAGING_VERIFY_ONLY: VERIFY_ONLY_NO_CHARGES
      DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
      PAYSTACK_SECRET_KEY: ${{ secrets.STAGING_PAYSTACK_TEST_SECRET }}
      REPLICATE_API_TOKEN: ${{ secrets.STAGING_REPLICATE_API_TOKEN }}
      ELEVENLABS_API_KEY: ${{ secrets.STAGING_ELEVENLABS_API_KEY }}
      LUQI_ELEVENLABS_VOICE_ID: ${{ vars.STAGING_ELEVENLABS_VOICE_ID }}
      LUQI_VIDEO_BUCKET: ${{ vars.STAGING_VIDEO_BUCKET }}
      R2_ACCOUNT_ID: ${{ vars.STAGING_R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.STAGING_R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.STAGING_R2_SECRET_ACCESS_KEY }}
      AWS_REGION: ${{ vars.STAGING_AWS_REGION }}
      AWS_ACCESS_KEY_ID: ${{ secrets.STAGING_AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.STAGING_AWS_SECRET_ACCESS_KEY }}
      LUQI_FFMPEG_PATH: /usr/bin/ffmpeg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install runtime media tool
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run read-only staging preflight (no provider billing)
        run: npx tsx scripts/checkStagingVideoReadiness.ts
