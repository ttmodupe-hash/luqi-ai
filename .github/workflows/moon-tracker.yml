name: LUQI Moon Tracker
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: moon-${{ github.ref }}
  cancel-in-progress: true
jobs:
  moon-calculation-and-privacy:
    runs-on: ubuntu-24.04
    # Use the same digest-pinned browser+OS image already validated by the
    # WebKit launch gate. Public APT mirrors stalled for 15 minutes before
    # any Moon browser assertions ran; do not skip Chromium or WebKit tests.
    container:
      image: mcr.microsoft.com/playwright:v1.58.2-noble@sha256:6446946a1d9fd62d9ae501312a2d76a43ee688542b21622056a372959b65d63d
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Check lunar references above and below the horizon, privacy and mirrored homepage
        run: node --test tests/moon-tracker.test.mjs tests/moon-above-horizon.test.mjs
      - name: Install locked UI test dependencies without lifecycle scripts
        run: npm ci --legacy-peer-deps --ignore-scripts
      - name: Exercise optional location, live updates, isolated lazy failures and retained discovery tools
        run: npx --no-install vitest run tests/moon-now.test.tsx tests/moon-real-surface.test.tsx tests/moon-loading.test.tsx tests/home-extras.test.tsx
      - name: Strictly type check the Moon and deferred homepage interfaces
        run: npx --no-install tsc --noEmit --strict --skipLibCheck --jsx react-jsx --target es2022 --module esnext --moduleResolution bundler --esModuleInterop src/components/MoonNowPanel.tsx src/components/MoonDisc.tsx src/components/MoonNowContent.tsx src/components/HomeExtras.tsx src/components/HomeDiscoveryContent.tsx
      - name: Build the actual frontend without production credentials
        run: npx --no-install vite build
      - name: Verify locked Chromium and WebKit acceptance browsers
        run: |
          test "$(node -p "require('@playwright/test/package.json').version")" = "1.58.2"
          test "$PLAYWRIGHT_BROWSERS_PATH" = "/ms-playwright"
          test -d /ms-playwright
          npx --no-install playwright --version
      - name: Verify desktop and narrow-phone Moon journeys and real import-failure recovery
        run: node scripts/frontend-feature-acceptance.mjs moon
      - name: Preserve browser screenshots and exact test revision
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: moon-browser-acceptance
          path: artifacts/feature-acceptance/moon/
          retention-days: 7
          if-no-files-found: warn
