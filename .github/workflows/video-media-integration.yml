name: LUQI Real Video + Narration Composition
on:
  pull_request:
    branches: [main, "fix/**"]
    paths:
      - "api/services/paidNarration*"
      - "api/services/privateMediaValidation.ts"
      - "api/services/paidVideo.ts"
      - ".github/workflows/video-media-integration.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  real-ffmpeg-composition:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RUN_FFMPEG_INTEGRATION: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Verify real FFmpeg and FFprobe are available
        run: |
          test -x /usr/bin/ffmpeg
          test -x /usr/bin/ffprobe
          /usr/bin/ffmpeg -version | head -n 1
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Create real video and MP3, compose and inspect MP4 tracks
        run: npx vitest run api/services/paidNarration.ffmpeg.integration.test.ts
