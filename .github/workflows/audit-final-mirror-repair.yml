name: Luqi audit final mirror repair
on:
  push:
    branches: [fix/luqi-interaction-audit-20261101]
    paths: [.github/workflows/audit-final-mirror-repair.yml]
permissions:
  contents: write
jobs:
  repair:
    if: github.repository == 'ttmodupe-hash/luqi-ai' && github.ref == 'refs/heads/fix/luqi-interaction-audit-20261101'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Correct exact inspected sources and maintain both build trees
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from hashlib import sha256
          def load(name, digest):
              value=Path(name).read_text()
              assert sha256(value.encode()).hexdigest()==digest, name
              return value
          def save(name,value):
              Path(name).write_text(value)
              Path('app/'+name).write_text(value)
          name='src/pages/AiPilotPage.tsx'
          value=load(name,'254ad6b9cab5f2ab65e0ebed2fb493de43099e48046c1af4fd0dfd0ab243c128')
          old="  useEffect(() => {\n    const draft = readChatReturn(customerSessionBoundary(session));"
          assert value.count(old)==1
          value=value.replace(old,"  useEffect(() => {\n    if (!workspaceMode) return; // Embedded helpers cannot consume the main Chat draft.\n    const draft = readChatReturn(customerSessionBoundary(session));")
          save(name,value)
          name='src/components/CertMasterVideoCoach.tsx'
          value=load(name,'7b6d6a7887782c19510fb4ad67c2e5891b9f9a5b004aaad9201299bbd53d2ead')
          value=value.replace('useState<boolean>(true);','useState<boolean>(false);',1)
          value=value.replace("  const [isGenerating, setIsGenerating] = useState<boolean>(false);", "  const [previewNotice, setPreviewNotice] = useState('Choose a local example. These are practice illustrations, not a verified answer to an arbitrary question.');")
          start=value.index('  // Dynamically generate a new 4-scene')
          end=value.index('\n  return (',start)
          value=value[:start]+'''  // Explicit local examples only. Arbitrary questions belong to the authenticated Chat below.
          const handleAskAndGenerateVideo = (customQuery?: string) => {
            const query = (customQuery ?? questionInput).trim();
            if (!query) return;
            setQuestionInput(query); setIsPlaying(false);
            const q = query.toLowerCase();
            const choices: [string[], TechnicalWalkthroughPayload, number][] = [
              [['stp', 'spanning tree', 'in standard ieee 802.1d spanning tree protocol, which port state learns macs without forwarding frames?', 'in standard ieee 802.1d spanning tree protocol, which port state is responsible for processing bpdus, learning mac addresses from frames, but not forwarding user data frames?'], DEFAULT_STP_VIDEO_WALKTHROUGH, 2],
              [['bgp', 'explain bgp path selection mnemonic (weight, local_pref, originate, as_path, origin, med)'], BGP_VIDEO_WALKTHROUGH, 0],
              [['governance', 'compare iso 42001 vs eu ai act in itil 5 governance'], ITIL_VIDEO_WALKTHROUGH, 0],
              [['ospf', 'how does ospf dr/bdr election work on broadcast multi-access segments?'], OSPF_VIDEO_WALKTHROUGH, 0],
              [['subnetting', 'walk through a /27 vlsm subnetting calculation step-by-step'], SUBNETTING_VIDEO_WALKTHROUGH, 0],
            ];
            const choice = choices.find(([terms]) => terms.includes(q));
            if (!choice) {
              setPreviewNotice('No matching local example. Your text is retained; the previous illustration is unchanged and is NOT an answer to this question. Use the signed-in Luqi text helper below. No AI request was made.');
              return;
            }
            setWalkthrough(choice[1]); setCurrentSceneIdx(choice[2]);
            setPreviewNotice('Local practice example selected. Check the material against original standards; no AI generation, live router access or certification validation occurred.');
          };
          '''+value[end:]
          value=value.replace('    if (!isPlaying) return;', "    if (!isPlaying) { window.speechSynthesis?.cancel(); return; }",1)
          value=value.replace('    return () => clearTimeout(timer);\n  }, [isPlaying, currentSceneIdx, walkthrough]);', '    return () => { clearTimeout(timer); window.speechSynthesis?.cancel(); };\n  }, [isPlaying, currentSceneIdx, walkthrough, voiceEnabled]);')
          value=value.replace('              if (!isPlaying) speakSceneNarration(currentScene.narrationScript);','')
          value=value.replace('🎬 CertMaster Live Video Walkthrough & RFC Proctor','Local practice walkthrough · not live network evidence')
          value=value.replace('💻 Cisco IOS CLI Verification','Illustrative CLI output · not a real device result')
          value=value.replace('🔊 Voice Proctor: ON','Browser narration: on').replace('🔈 Voice Proctor: Muted','Browser narration: off')
          value=value.replace('            value={questionInput}', '            aria-label="Local walkthrough topic"\n            maxLength={1000}\n            value={questionInput}')
          value=value.replace('Ask any CCNA, CCNP, CCIP, or ITIL 5 question to generate a live video walkthrough...', 'Choose a preset, or enter STP, BGP, OSPF, subnetting or governance')
          value=value.replace('            disabled={isGenerating}', '            disabled={!questionInput.trim()}')
          value=value.replace("{isGenerating ? 'Compiling Video...' : '🎬 Generate Video Walkthrough'}", 'Open local example')
          value=value.replace('        </form>','        </form>\n        <p role="status" className="text-sm text-amber-200">{previewNotice}</p>')
          assert 'fetch(' not in value and 'isGenerating' not in value and 'setIsGenerating' not in value
          save(name,value)
          PY
          git add -- src/pages/AiPilotPage.tsx app/src/pages/AiPilotPage.tsx src/components/CertMasterVideoCoach.tsx app/src/components/CertMasterVideoCoach.tsx
          git diff --cached --check
      - name: Fast-forward isolated audit branch only
        run: |
          set -euo pipefail
          branch=fix/luqi-interaction-audit-20261101
          test "$(git ls-remote origin refs/heads/$branch | cut -f1)" = "$(git rev-parse HEAD)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: mirror local walkthrough, reject unrelated fallback and isolate Chat draft restoration'
          git push origin HEAD:refs/heads/$branch
