name: LUQI Offline Spend Review
on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/review-ai-pilot-spend.py'
      - 'tests/test_ai_pilot_spend_review.py'
      - 'docs/AI_SPEND_REVIEW.md'
      - 'api/services/aiPilotBudget.ts'
      - '.github/workflows/pilot-spend-review.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/review-ai-pilot-spend.py'
      - 'tests/test_ai_pilot_spend_review.py'
      - 'docs/AI_SPEND_REVIEW.md'
      - 'api/services/aiPilotBudget.ts'
      - '.github/workflows/pilot-spend-review.yml'
permissions:
  contents: read
concurrency:
  group: pilot-spend-review-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify-synthetic-spend-evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Verify offline comparison and private-file guards
        run: python -m unittest discover -s tests -p test_ai_pilot_spend_review.py -v
      - name: Require explicit review when runtime reservation policy changes
        shell: bash
        run: |
          grep -Fxq 'export const PILOT_CENTS = Object.freeze({ gemini: 6000, openai: 4000 });' api/services/aiPilotBudget.ts
          grep -Fxq 'export const PILOT_TOTAL_CENTS = 10000;' api/services/aiPilotBudget.ts
          grep -Fxq 'export const RESERVE_PER_ATTEMPT_CENTS = 10;' api/services/aiPilotBudget.ts
      # No credentials, provider requests, production evidence or report artifacts.
