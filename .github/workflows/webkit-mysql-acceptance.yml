name: LUQI WebKit MySQL Acceptance
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: webkit-mysql-${{ github.ref }}
  cancel-in-progress: true
jobs:
  webkit-real-accounts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci-ephemeral-only-password
          MYSQL_DATABASE: luqi_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -pci-ephemeral-only-password"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      # Disposable fixture only. No production secrets or provider credentials.
      LUQI_MYSQL_CI_FIXTURE: 'true'
      DATABASE_URL: 'mysql://root:ci-ephemeral-only-password@127.0.0.1:3306/luqi_ci'
      NODE_ENV: test
      LUQI_AI_PROVIDER_ENABLED: 'false'
      LUQI_AI_BILLING_APPROVED: 'false'
      LUQI_AI_CREDENTIAL_CHECK_ENABLED: 'false'
      LUQI_OMEGA_WEB_ENABLED: 'false'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Install locked tooling without lifecycle scripts
        run: npm ci --legacy-peer-deps --include=dev --ignore-scripts
      - name: Prove configuration collection and refusal guards without account writes
        run: node --test tests/webkit-mysql-config.test.mjs
      - name: Build actual production web and operator bundles
        run: npm run build
      - name: Prepare and verify the existing restricted-role disposable fixture
        run: npx --no-install vitest run tests/mysql-runtime-role.integration.test.ts --no-file-parallelism
      - name: Install the lockfile-matched WebKit engine and system dependencies
        timeout-minutes: 6
        run: npx --no-install playwright install --with-deps webkit
      - name: Verify registration, persisted notes, export, deletion and password change in WebKit
        run: npx --no-install playwright test --config playwright.mysql-webkit.config.ts
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: webkit-mysql-evidence
          path: |
            webkit-mysql-results.json
            test-results-webkit-mysql/
          retention-days: 7
          if-no-files-found: ignore
