name: LUQI WebKit MySQL Acceptance
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: webkit-mysql-${{ github.ref }}
  cancel-in-progress: true
jobs:
  webkit-real-accounts:
    # Playwright 1.58.2 does not support Ubuntu 26.04. Keep the browser and
    # supported OS aligned instead of following the moving latest label.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci-ephemeral-only-password
          MYSQL_DATABASE: luqi_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -pci-ephemeral-only-password"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      # Disposable fixture only. No production secrets or provider credentials.
      LUQI_MYSQL_CI_FIXTURE: 'true'
      DATABASE_URL: 'mysql://root:ci-ephemeral-only-password@127.0.0.1:3306/luqi_ci'
      NODE_ENV: test
      LUQI_AI_PROVIDER_ENABLED: 'false'
      LUQI_AI_BILLING_APPROVED: 'false'
      LUQI_AI_CREDENTIAL_CHECK_ENABLED: 'false'
      LUQI_OMEGA_WEB_ENABLED: 'false'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Install locked tooling without lifecycle scripts
        run: npm ci --legacy-peer-deps --include=dev --ignore-scripts
      - name: Prove configuration collection and refusal guards without account writes
        run: node --test tests/webkit-mysql-config.test.mjs
      - name: Build actual production web and operator bundles
        env:
          # Vite mode alone does not override an inherited NODE_ENV=test.
          # Build the production React branch, while test/fixture steps stay test.
          NODE_ENV: production
        run: npm run build
      - name: Prepare and verify the existing restricted-role disposable fixture
        run: npx --no-install vitest run tests/mysql-runtime-role.integration.test.ts --no-file-parallelism
      # GitHub runner APT mirrors repeatedly stall before the real browser assertions.
      # Run the locked WebKit engine in the same digest-pinned official image already
      # accepted by the production Lab Framing check. The disposable MySQL service
      # stays on the host, and --network host preserves the exact 127.0.0.1 fixture guard.
      - name: Verify registration, persisted notes, export, deletion and password change in pinned WebKit
        timeout-minutes: 15
        shell: bash
        run: |
          set -euo pipefail
          image='mcr.microsoft.com/playwright:v1.58.2-noble@sha256:6446946a1d9fd62d9ae501312a2d76a43ee688542b21622056a372959b65d63d'
          docker run --rm --init --network host --ipc host \
            --volume "$GITHUB_WORKSPACE:/work" --workdir /work \
            --env GITHUB_ACTIONS=true --env LUQI_MYSQL_CI_FIXTURE \
            --env DATABASE_URL --env NODE_ENV=test \
            --env LUQI_AI_PROVIDER_ENABLED --env LUQI_AI_BILLING_APPROVED \
            --env LUQI_AI_CREDENTIAL_CHECK_ENABLED --env LUQI_OMEGA_WEB_ENABLED \
            "$image" bash -lc '
              set -euo pipefail
              test "$(node -p "require(\"@playwright/test/package.json\").version")" = "1.58.2"
              test "$PLAYWRIGHT_BROWSERS_PATH" = "/ms-playwright"
              test -d /ms-playwright
              npx --no-install playwright test --config playwright.mysql-webkit.config.ts
            '
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: webkit-mysql-evidence
          path: |
            webkit-mysql-results.json
            test-results-webkit-mysql/
          retention-days: 7
          if-no-files-found: ignore
