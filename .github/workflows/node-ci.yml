name: Node CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, develop, "fix/**"]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: TypeScript project check
        run: npm run check
      - name: Unit tests
        run: npm test
      - name: Production build
        run: npm run build
