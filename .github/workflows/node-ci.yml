name: Node CI

on:
  pull_request:
    branches: [main, "fix/**"]
  push:
    branches: [main, develop, "fix/**"]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # Lockfile is committed and must be respected by every release validation.
      - run: npm ci --no-audit --no-fund
      - name: TypeScript project check
        run: npm run check
      - name: Unit tests
        if: always()
        run: npm test
      - name: Production build
        if: always()
        run: npm run build
