name: LUQI Python Core Syntax and Symbols (no deployment)
on:
  pull_request:
    branches: [main]
    paths:
      - "construction_calc.py"
      - "main.py"
      - "backend/async_job_routes.py"
      - ".github/workflows/python-core-lint-check.yml"
  push:
    branches: ["fix/python-core-lint-*"]
permissions:
  contents: read
jobs:
  python-core:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile changed Python modules
        run: python -m compileall -q construction_calc.py main.py backend/async_job_routes.py
      - name: Check fatal syntax and undefined-name errors in repaired modules
        run: |
          python -m pip install flake8==7.4.1
          python -m flake8 construction_calc.py main.py backend/async_job_routes.py --count --select=E9,F63,F7,F82 --show-source --statistics
