name: LUQI Contacts Away State
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: contacts-away-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify-explicit-away:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Verify deterministic presence states without accounts or network
        run: node --experimental-transform-types --test tests/presence-away.test.mjs
      - name: Install locked test dependencies without lifecycle scripts
        run: npm ci --legacy-peer-deps --ignore-scripts
      - name: Verify opt-in status controls, actor binding and existing P2P protections
        run: npx --no-install vitest run tests/contact-presence.test.ts tests/contact-presence-client.test.tsx tests/contact-presence-away.test.tsx tests/approved-contacts-panel.test.tsx tests/p2p-routes.test.ts tests/presence-away-routes.test.ts tests/p2p-parity.test.ts
      - name: Strictly type-check the changed API and contacts interface
        run: npx --no-install tsc --noEmit --strict --skipLibCheck --jsx react-jsx --target es2022 --module esnext --moduleResolution bundler --esModuleInterop api/p2p.ts src/components/ApprovedContactsPanel.tsx src/components/useContactPresence.ts
