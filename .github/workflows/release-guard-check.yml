name: LUQI Legacy GCP Release Guard
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/deploy.yml'
      - 'cloudbuild.yaml'
      - 'scripts/check-release-guard.mjs'
      - '.github/workflows/release-guard-check.yml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy.yml'
      - 'cloudbuild.yaml'
      - 'scripts/check-release-guard.mjs'
      - '.github/workflows/release-guard-check.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  static-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check legacy GCP deploy is disabled without using cloud credentials
        run: node scripts/check-release-guard.mjs
