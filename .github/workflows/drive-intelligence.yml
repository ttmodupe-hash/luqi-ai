name: LUQI Drive Evidence and Planning
on:
  pull_request:
    branches: [main]
    paths: ['src/features/drive/**', 'app/src/features/drive/**', 'api/services/drive-source-*', 'api/drive-source-status.ts', 'api/router.ts', 'api/middleware.ts', 'scripts/drive-source-radar.mjs', 'tests/drive-intelligence*', 'tests/drive-source-status*', 'tests/luqi-drive-gps.test.tsx', 'browser-tests/drive-intelligence.spec.ts', 'browser-tests/drive-source-status.spec.ts', '.github/workflows/drive-intelligence.yml']
  push:
    branches: [main]
    paths: ['src/features/drive/**', 'app/src/features/drive/**', 'api/services/drive-source-*', 'api/drive-source-status.ts', 'api/router.ts', 'api/middleware.ts', 'scripts/drive-source-radar.mjs', 'tests/drive-intelligence*', 'tests/drive-source-status*', 'browser-tests/drive-intelligence.spec.ts', 'browser-tests/drive-source-status.spec.ts', '.github/workflows/drive-intelligence.yml']
permissions:
  contents: read
jobs:
  local-planning-and-source-boundaries:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/drive-intelligence-parity.test.mjs
      - run: npm ci --legacy-peer-deps --include=dev --ignore-scripts
      - name: Verify status privacy, real tRPC transport, bounded files and existing GPS flows
        run: npx --no-install vitest run tests/drive-intelligence.test.ts tests/drive-intelligence-panel.test.tsx tests/luqi-drive-gps.test.tsx tests/field-and-bench.test.tsx tests/drive-source-status.test.ts tests/drive-source-status-panel.test.tsx
      - name: Strictly type-check both frontend trees and the read-only status API
        run: npx --no-install tsc --noEmit --strict --skipLibCheck --jsx react-jsx --target es2022 --module esnext --moduleResolution bundler --esModuleInterop src/features/drive/DriveIntelligencePanel.tsx app/src/features/drive/DriveIntelligencePanel.tsx src/features/drive/DriveSourceStatusPanel.tsx app/src/features/drive/DriveSourceStatusPanel.tsx api/drive-source-status.ts api/services/drive-source-radar.ts api/services/drive-source-status-store.ts
      - name: Compile real operator modules and verify no-fetch default
        run: |
          mkdir -p "$RUNNER_TEMP/luqi-drive-build"
          printf '{"type":"module"}\n' > "$RUNNER_TEMP/luqi-drive-build/package.json"
          npx --no-install tsc --strict --skipLibCheck --target es2022 --module es2022 --moduleResolution bundler --outDir "$RUNNER_TEMP/luqi-drive-build" src/features/drive/drive-intelligence.ts api/services/drive-source-radar.ts
          LUQI_DRIVE_RADAR_BUILD_DIR="$RUNNER_TEMP/luqi-drive-build" LUQI_DRIVE_RADAR_STATE_DIR="$RUNNER_TEMP/luqi-drive-state" node scripts/drive-source-radar.mjs
      - name: Build unchanged application shell with additive Drive workspace
        run: npx --no-install vite build
      - name: Exercise built desktop and mobile journeys with providers disabled
        run: |
          browser="$(command -v google-chrome || command -v chromium || true)"
          if [ -n "$browser" ]; then
            export LUQI_CHROMIUM_PATH="$browser"
          else
            npx --no-install playwright install --with-deps chromium --only-shell
          fi
          npx --no-install playwright test browser-tests/drive-intelligence.spec.ts browser-tests/drive-source-status.spec.ts --workers=1
      - name: Preserve synthetic browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: drive-intelligence-browser-evidence
          path: test-results/
          if-no-files-found: ignore
