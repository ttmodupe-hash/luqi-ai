name: LUQI Production Lab Framing
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  status:
permissions:
  contents: read
concurrency:
  # Status deliveries are isolated; no main-push safety job may be cancelled.
  group: lab-framing-${{ github.event_name }}-${{ github.event_name == 'status' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  production-browser-boundary:
    # Only candidate pre-deployment checks; no public release identity assertions.
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-24.04
    # Official Microsoft browser image includes preinstalled browser engines and system dependencies.
    # Pin the exact Playwright 1.58.2 Noble image digest to avoid slow unbounded APT mirrors.
    container:
      image: mcr.microsoft.com/playwright:v1.58.2-noble@sha256:6446946a1d9fd62d9ae501312a2d76a43ee688542b21622056a372959b65d63d
      options: --user 1001
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: node --test tests/lab-framing-release-gates.test.mjs
      - run: npm ci --legacy-peer-deps --include=dev
      - name: Test HTTP framing, missing assets, exact release identity and privacy boundaries
        run: npx --no-install vitest run tests/frame-policy.test.ts tests/lab-static-fallback.test.ts tests/http-safety.test.ts tests/release-observation.test.ts
      - name: Strictly type-check response policy
        run: npx --no-install tsc --noEmit --strict --skipLibCheck --target es2022 --module esnext --moduleResolution bundler --esModuleInterop api/lib/framePolicy.ts api/lib/httpSafety.ts api/lib/vite.ts
      - name: Build the actual production server and UI without credentials
        run: npm run build
      - name: Verify locked browser test image and bundled engines
        run: |
          test "$(node -p "require('@playwright/test/package.json').version")" = "1.58.2"
          test "$PLAYWRIGHT_BROWSERS_PATH" = "/ms-playwright"
          test -d /ms-playwright
          npx --no-install playwright --version
      - name: Exercise real-server lab frames and clickjacking boundaries
        run: npx --no-install playwright test --config=playwright.framing.config.ts
      - name: Retain synthetic failure evidence
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: lab-framing-failure
          path: test-results-framing/
          retention-days: 7
          if-no-files-found: ignore
  public-framing:
    # This is an independent post-deployment check, never a Wait-for-CI prerequisite.
    if: >-
      github.event_name == 'status' &&
      github.event.state == 'success' &&
      github.event.context == 'kind-spontaneity - web' &&
      github.event.sha == github.sha &&
      startsWith(github.event.target_url, 'https://railway.com/project/9f627cb8-3136-4b30-89d2-32ca648a1e5f/service/a9b293e0-1966-43be-80ef-3dd27acc6ab7') &&
      contains(github.event.target_url, 'environmentId=1e192ef3-1fa6-4684-81fc-60165c7b0e22')
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Reject foreign, stale, preview or unsuccessful Railway statuses
        env:
          LUQI_MAIN_SHA: ${{ github.sha }}
        run: node scripts/check-canonical-railway-status.mjs
      - name: Observe the exact live release and existing safety boundaries
        env:
          LUQI_VERIFY_PUBLIC: 'true'
          LUQI_EXPECTED_COMMIT: ${{ github.event.sha }}
        run: node scripts/verify-deployed-release.mjs
      - name: Verify deployed lab documents and restrictive framing policy
        env:
          LUQI_VERIFY_PUBLIC: 'true'
          LUQI_EXPECTED_COMMIT: ${{ github.event.sha }}
        run: node scripts/verify-lab-framing.mjs
