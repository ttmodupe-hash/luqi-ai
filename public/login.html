<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
  <title>LUQI account access</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #102017; color: #f4f7ed; font: 16px/1.6 system-ui, sans-serif; }
    main { margin: 10vh auto; width: min(92vw, 560px); padding: 30px; border: 1px solid #6f886c; border-radius: 16px; }
    h1 { font-size: 1.8rem; }
    p { color: #d8e2d4; }
    nav { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 24px; }
    a { color: #ebf6d6; text-decoration: underline; border: 1px solid #70876d; padding: 12px 16px; border-radius: 8px; min-height: 48px; }
    a:focus-visible { outline: 3px solid #bedfa1; outline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <h1>Sign in to LUQI</h1>
    <p>This older login address has been retired. Use the current account pages to sign in or create an account. No password or account information is collected here.</p>
    <nav aria-label="Account options">
      <a href="/#/companion">Sign in</a>
      <a href="/#/join">Create account</a>
      <a href="/#/contact">Account recovery guidance</a>
    </nav>
  </main>
</body>
</html>
